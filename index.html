<style>
  :root{
    --ink:#2b2d33;
    --muted:#6b6f78;
    --card:#ffffff;
    --card-line:#e2e2ea;
    --paper:#fbfafc;
    --highlight:#d9e3f0;
    --highlight-line:#c3d3e6;
    --grad-start:#dfe7f4;
    --grad-end:#f6e3ea;
    --red:#c15a6b;
    --red-bg:#f8e2e6;
    --green:#4f8f7c;
    --green-bg:#e2f0ea;
    --neutral:#b7bcc2;
    --neutral-bg:#eef0f2;
    --pink:#f0c7d4;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
    margin:0;
    overflow:hidden;
  }
  body{
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    background:var(--paper);
  }
  h1,h2,h3,.brand{font-family:'Fraunces', serif;}

  .file-setup{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--grad-start) 0%, var(--grad-end) 100%);
    z-index:50;
    padding:20px;
  }
  .setup-box{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:32px 36px;
    max-width:420px;
    text-align:center;
  }
  .setup-box h2{margin:0 0 10px; font-size:21px;}
  .setup-box p{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.55;}
  .setup-box .filename{font-weight:600; color:var(--ink);}
  .setup-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .setup-actions button{
    padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:13.5px;
    background:var(--highlight); color:var(--ink);
  }
  .setup-actions button.secondary{
    background:none; border:1px solid var(--card-line); color:var(--muted);
  }
  .setup-actions button:hover{filter:brightness(0.97);}

  #appShell{
    display:none;
    height:100vh;
  }
  #appShell.visible{display:flex;}

  #sidebar{
    width:280px;
    flex-shrink:0;
    background:linear-gradient(165deg, var(--grad-start) 0%, var(--grad-end) 100%);
    color:var(--ink);
    border-right:1px solid var(--card-line);
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .brand{
    font-size:18px;
    font-weight:600;
    letter-spacing:0.2px;
    color:var(--ink);
  }
  .brand small{
    display:block;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:9.5px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:0.8px;
    text-transform:uppercase;
    margin-top:2px;
  }
  #addClientForm{
    display:flex;
    gap:6px;
  }
  #newClientName{
    flex:1;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid var(--card-line);
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
  }
  #newClientName::placeholder{color:var(--muted);}
  .search-empty{
    color:var(--muted);
    font-size:12.5px;
    font-style:italic;
    padding:10px 4px;
    line-height:1.5;
  }
  .sidebar-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    opacity:0.75;
    flex:1;
    padding:30px 16px;
    gap:12px;
  }
  .sidebar-empty svg{width:52px; height:52px; flex-shrink:0;}
  .sidebar-empty span{font-size:12.5px; line-height:1.5;}
  #addClientForm button{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-weight:600;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    font-size:13px;
  }
  #addClientForm button:hover{filter:brightness(0.97);}
  .sort-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  .sort-row select{
    flex:1;
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    border:1px solid var(--card-line);
    border-radius:6px;
    padding:5px 6px;
    font-family:inherit;
    font-size:12.5px;
  }
  #clientList{
    list-style:none;
    margin:0;
    padding:0;
    overflow-y:auto;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .client-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .client-row:hover{background:rgba(255,255,255,0.55);}
  .client-row.active{background:var(--highlight); border-color:var(--highlight-line);}
  .seal{
    width:12px;height:12px;border-radius:50%;
    flex-shrink:0;
    box-shadow:0 0 0 3px rgba(43,45,51,0.05);
  }
  .seal.red{background:var(--red);}
  .seal.green{background:var(--green);}
  .seal.neutral{background:var(--neutral);}
  .client-name{
    flex:1;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .todo-badge{
    flex-shrink:0;
    min-width:16px;
    height:16px;
    padding:0 4px;
    border-radius:8px;
    background:var(--accent, #c98a4b);
    background:#e8a94b;
    color:#3a2a0a;
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .todo-badge.overdue{
    background:var(--red);
    color:#fff;
  }
  .client-del{
    opacity:0;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
  .client-edit{
    opacity:0;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
  .client-row:hover .client-del,
  .client-row:hover .client-edit{opacity:0.7;}
  .client-del:hover{opacity:1 !important; color:var(--red);}
  .client-edit:hover{opacity:1 !important; color:var(--ink);}
  .client-name-input{
    flex:1;
    font-family:inherit;
    font-size:14px;
    padding:4px 6px;
    border-radius:5px;
    border:1px solid var(--highlight-line);
    background:#ffffff;
    color:var(--ink);
  }
  #sidebarFooter{
    margin-top:auto;
    padding-top:12px;
    border-top:1px solid var(--card-line);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  #fileStatus{
    font-size:11px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #fileStatus .dot{
    display:inline-block; width:7px;height:7px;border-radius:50%;
    background:var(--green); margin-right:6px;
  }
  #manualSaveBtn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-family:inherit;
  }
  #manualSaveBtn:hover{filter:brightness(0.97);}

  #settingsNavBtn{
    background:none;
    border:1px solid var(--card-line);
    color:var(--muted);
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-family:inherit;
  }
  #settingsNavBtn:hover{color:var(--ink); border-color:var(--highlight-line);}

  .backups-modal{
    display:none;
    position:fixed; inset:0;
    background:rgba(43,45,51,0.35);
    z-index:60;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .backups-modal.open{display:flex;}
  .backups-box{
    background:var(--card);
    border-radius:14px;
    max-width:480px;
    width:100%;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .backups-box-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 10px;
  }
  .backups-box-header h2{margin:0; font-size:19px;}
  .backups-box-header button{
    background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:2px 6px;
  }
  .backups-box-header button:hover{color:var(--red);}
  .backups-note{
    margin:0 20px 12px;
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
  }
  #backupsList{
    overflow-y:auto;
    padding:0 20px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .backup-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--card-line);
    border-radius:8px;
  }
  .backup-row-info{font-size:13px; color:var(--ink);}
  .backup-row-info small{display:block; color:var(--muted); font-size:11px; margin-top:2px;}
  .backup-restore-btn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .backup-restore-btn:hover{filter:brightness(0.97);}
  .backups-empty{color:var(--muted); font-size:13px; font-style:italic; padding:8px 0;}
  .settings-section{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .settings-section h3{margin:0 0 6px; font-size:15px;}
  .settings-section p{margin:0 0 12px; font-size:13px; color:var(--muted); line-height:1.5;}
  .settings-section .settings-btn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
    font-family:inherit;
  }
  .settings-section .settings-btn:hover{filter:brightness(0.97);}

/* ---------- IndexedDB: remember the picked file handle + rolling backups ---------- */
const IDB_NAME = 'danisan-takip-db';
const IDB_STORE = 'handles';
const IDB_BACKUP_STORE = 'backups';
const MAX_BACKUPS = 30;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){ db.createObjectStore(IDB_STORE); }
      if(!db.objectStoreNames.contains(IDB_BACKUP_STORE)){
        db.createObjectStore(IDB_BACKUP_STORE, { keyPath:'timestamp' });
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

async function saveBackupSnapshot(stateObj){
  try{
    const db = await idbOpen();
    const snapshot = { timestamp: Date.now(), data: JSON.stringify(stateObj) };
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_BACKUP_STORE,'readwrite');
      tx.objectStore(IDB_BACKUP_STORE).put(snapshot);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
    await pruneBackups(db);
  }catch(e){ console.error('Yedek kaydedilemedi', e); }
}

async function pruneBackups(db){
  return new Promise((resolve)=>{
    const tx = db.transaction(IDB_BACKUP_STORE,'readwrite');
    const store = tx.objectStore(IDB_BACKUP_STORE);
    const req = store.getAllKeys();
    req.onsuccess = ()=>{
      const keys = req.result.sort((a,b)=>a-b);
      const excess = keys.length - MAX_BACKUPS;
      if(excess > 0){
        for(let i=0;i<excess;i++){ store.delete(keys[i]); }
      }
      resolve();
    };
  });
}

async function listBackups(){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_BACKUP_STORE,'readonly');
    const req = tx.objectStore(IDB_BACKUP_STORE).getAll();
    req.onsuccess = ()=>resolve((req.result||[]).sort((a,b)=>b.timestamp-a.timestamp));
    req.onerror = ()=>reject(req.error);
  });
}

function initGisTokenClient(){

    setTimeout(initGisTokenClient, 300);
    return;
  }
  gisTokenClient = window.google.accounts.oauth2.initTokenClient({

    scope: GOOGLE_API_SCOPES,
    callback: ()=>{} // overridden per-call in trySilentGisRefresh

function storeGoogleAccessToken(token){
  googleAccessToken = token;
  googleAccessTokenObtainedAt = Date.now();
  try{
    sessionStorage.setItem('googleAccessToken', googleAccessToken);
    sessionStorage.setItem('googleAccessTokenObtainedAt', String(googleAccessTokenObtainedAt));
  }catch(e){ /* sessionStorage unavailable, ignore */ }
}

function trySilentGisRefresh(){
  return new Promise((resolve)=>{
    if(!gisTokenClient){ resolve(null); return; }
    const timeout = setTimeout(()=>resolve(null), 4000);
    gisTokenClient.callback = (tokenResponse)=>{
      clearTimeout(timeout);
      if(tokenResponse && tokenResponse.access_token){
        storeGoogleAccessToken(tokenResponse.access_token);
        resolve(googleAccessToken);
      }else{
        resolve(null);
      }
    };
    try{
      gisTokenClient.requestAccessToken({ prompt: '' });
    }catch(e){ resolve(null); }
  });
}

try{

  const storedAt = Number(sessionStorage.getItem('googleAccessTokenObtainedAt') || 0);
  if(storedToken && storedAt && (Date.now() - storedAt < 50*60*1000)){
    googleAccessToken = storedToken;
    googleAccessTokenObtainedAt = storedAt;
  }
}catch(e){ /* sessionStorage unavailable, ignore */ }

function captureAccessTokenFromResult(result){
  try{
    const cred = window.FB.credentialFromResult(result);
    if(cred && cred.accessToken){
      storeGoogleAccessToken(cred.accessToken);
    }
  }catch(e){ console.error('Token yakalama hatası', e); }
}

async function ensureGoogleAccessToken(){
  if(googleAccessToken && (Date.now() - googleAccessTokenObtainedAt < 50*60*1000)){
    return googleAccessToken;
  }
  const silent = await trySilentGisRefresh();
  if(silent) return silent;
  try{
    const result = await window.FB.signInWithPopup(window.FB.auth, window.FB.provider);
    captureAccessTokenFromResult(result);
    return googleAccessToken;
  }catch(e){

    return null;

}

    imported = JSON.parse(text);

    alert('Dosya okunamadı. Geçerli bir JSON dosyası seçtiğinden emin ol.');
    return;
  }
  const importedClients = Array.isArray(imported.clients) ? imported.clients : [];
  const importedTodos = Array.isArray(imported.generalTodos) ? imported.generalTodos : [];
  if(!importedClients.length && !importedTodos.length){
    alert('Bu dosyada içe aktarılacak danışan bulunamadı.');
    return;
  }
  if(!confirm(`${importedClients.length} danışan bu hesaba eklenecek. Mevcut verilerin üzerine yazılmaz, üstüne eklenir. Devam edilsin mi?`)) return;

    if(!c.id) c.id = uid();

    if(c.generalAdminNote == null) c.generalAdminNote = '';
    if(!c.profile) c.profile = { info:'', address:'', phone:'', email:'', ifhp:false, rate:null };
    (c.sessions||[]).forEach(s=>{ if(!s.id) s.id = uid(); });
  });
  importedTodos.forEach(t=>{ if(!t.id) t.id = uid(); });

  state.clients = [...state.clients, ...importedClients];
  state.generalTodos = [...(state.generalTodos||[]), ...importedTodos];
  if(!activeClientId && state.clients.length){ activeClientId = state.clients[0].id; }
  saveState();
  render();
  alert(`${importedClients.length} danışan başarıyla içe aktarıldı.`);

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function clientStatus(client){
  if(!client.sessions.length) return 'neutral';
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  for(const s of client.sessions){
    const invoiceOk = noInvoice ? true : s.invoiceDone;
    if(!(s.paymentDone && invoiceOk && s.notesDone && s.nextDone)){
      return 'red';
    }
  }
  return 'green';
}

function pendingChecklistCount(client){
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  let count = 0;
  (client.sessions||[]).forEach(s=>{
    if(!s.paymentDone) count++;
    if(!noInvoice && !s.invoiceDone) count++;
    if(!s.notesDone) count++;
    if(!s.nextDone) count++;
  });
  return count;
}

function pendingTodoCount(client){
  return (client.todos||[]).filter(t=>!t.done).length;
}

function lastSessionDate(client){
  let max = null;
  client.sessions.forEach(s=>{
    if(s.date && (!max || s.date > max)) max = s.date;
  });
  return max;
}

function getSortedClients(){
  let arr = [...state.clients];
  if(sortMode === 'name'){
    arr.sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  } else if(sortMode === 'lastSession'){
    arr.sort((a,b)=>{
      const da = lastSessionDate(a);
      const db = lastSessionDate(b);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return db.localeCompare(da);
    });
  } else if(sortMode === 'pendingChecks'){
    arr.sort((a,b)=> pendingChecklistCount(b) - pendingChecklistCount(a));
  } else if(sortMode === 'pendingTodos'){
    arr.sort((a,b)=> pendingTodoCount(b) - pendingTodoCount(a));
  }
  if(searchQuery.trim()){
    const q = normalizeForSearch(searchQuery.trim());
    arr = arr.filter(c=>normalizeForSearch(c.name).includes(q));
  }
  return arr;
}

const TR_MAP = { 'ç':'c','Ç':'C','ğ':'g','Ğ':'G','ı':'i','İ':'I','ö':'o','Ö':'O','ş':'s','Ş':'S','ü':'u','Ü':'U' };
function toAscii(str){
  return (str||'').replace(/[çÇğĞıİöÖşŞüÜ]/g, ch => TR_MAP[ch] || ch);
}
function normalizeForSearch(str){
  return toAscii(str||'').toLowerCase();

function formatInvoiceDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

/* ---------- Google Calendar + Gmail (real attachment) integration ---------- */
async function fetchDayEvents(dateStr){
  const token = await ensureGoogleAccessToken();
  if(!token) return null;
  const start = new Date(`${dateStr}T00:00:00`);
  const end = new Date(`${dateStr}T23:59:59`);
  try{
    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(start.toISOString())}&timeMax=${encodeURIComponent(end.toISOString())}&singleEvents=true&orderBy=startTime`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if(!res.ok) return null;
    const data = await res.json();
    return data.items || [];
  }catch(e){
    return null;
  }
}

function formatEventTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function createCalendarEvent(client, opts){
  const token = await ensureGoogleAccessToken();
  if(!token) return false;

  const start = new Date(`${opts.dateStr}T${opts.timeStr}:00`);
  const end = new Date(start.getTime() + opts.durationMinutes*60000);
  const event = {
    summary: opts.title,
    start: { dateTime: start.toISOString() },
    end: { dateTime: end.toISOString() }
  };
  const sessionLink = getProvider().sessionLink;
  if(sessionLink && sessionLink.trim()){
    event.location = sessionLink.trim();
  }
  if(opts.inviteClient && client.profile && client.profile.email){
    event.attendees = [{ email: client.profile.email.trim() }];
  }

  try{
    const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(event)
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      alert('Randevu oluşturulamadı: ' + (err.error && err.error.message ? err.error.message : res.status));
      return false;
    }
    return true;
  }catch(e){
    alert('Randevu oluşturulamadı: ' + e.message);
    return false;
  }
}

function encodeMimeSubject(str){
  if(/^[\x00-\x7F]*$/.test(str)) return str;
  const bytes = new TextEncoder().encode(str);
  let binary=''; for(const b of bytes) binary += String.fromCharCode(b);
  return `=?UTF-8?B?${btoa(binary)}?=`;
}

function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary=''; for(const b of bytes) binary += String.fromCharCode(b);
  return btoa(binary);
}

function base64UrlEncode(str){
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function arrayBufferToBinaryString(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return binary;
}

async function createGmailDraftWithAttachment(client, session, doc, filename){
  const token = await ensureGoogleAccessToken();
  if(!token) return false;

  const to = (client.profile && client.profile.email) ? client.profile.email.trim() : '';
  const subject = `Your Receipt from ${getProvider().name} - ${formatInvoiceDate(session.date)}`;
  const bodyText = `Hello ${client.name},\n\nPlease find your receipt for the session on ${formatInvoiceDate(session.date)} attached.\n\nBest regards,`;

  const pdfBase64 = btoa(arrayBufferToBinaryString(doc.output('arraybuffer')));
  const boundary = 'boundary_' + Date.now();

  const mime =
    (to ? `To: ${to}\r\n` : '') +
    `Subject: ${encodeMimeSubject(subject)}\r\n` +
    `MIME-Version: 1.0\r\n` +
    `Content-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: text/plain; charset="UTF-8"\r\n` +
    `Content-Transfer-Encoding: base64\r\n\r\n` +
    `${utf8ToBase64(bodyText)}\r\n\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: application/pdf; name="${filename}"\r\n` +
    `Content-Disposition: attachment; filename="${filename}"\r\n` +
    `Content-Transfer-Encoding: base64\r\n\r\n` +
    `${pdfBase64}\r\n\r\n` +
    `--${boundary}--`;

  try{
    const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/drafts', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: { raw: base64UrlEncode(mime) } })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      alert('Taslak oluşturulamadı: ' + (err.error && err.error.message ? err.error.message : res.status));
      return false;
    }
    alert('Taslak Gmail\'de oluşturuldu — Gmail\'i açıp gözden geçirip gönderebilirsin.');
    return true;
  }catch(e){
    alert('Taslak oluşturulamadı: ' + e.message);
    return false;
  }
}

function invoiceFilename(client, session){
  const namePart = toAscii(client.name).replace(/\s+/g,'');
  let dd='00', mm='00', yy='00';
  if(session.date){
    const d = new Date(session.date + 'T00:00:00');
    dd = String(d.getDate()).padStart(2,'0');
    mm = String(d.getMonth()+1).padStart(2,'0');
    yy = String(d.getFullYear()).slice(-2);
  }
  return `Invoice-${namePart}${dd}.${mm}.${yy}.pdf`;
}

function generateInvoiceForSession(client, session, action){
  const ifhp = !!(client.profile && client.profile.ifhp);
  let rate;
  if(ifhp){
    rate = 205;
  }else{
    rate = client.profile ? Number(client.profile.rate) : NaN;
    if(!rate || rate <= 0){
      alert('Önce bu danışanın profiline seans ücretini girmelisin.');
      return;
    }
  }
  let invoiceNumber = '';
  if(ifhp){
    const entered = prompt('IFHP fatura numarasını gir:');
    if(!entered || !entered.trim()){
      alert('Fatura numarası girilmeden IFHP faturası oluşturulamaz.');
      return;
    }
    invoiceNumber = entered.trim();
  }

  const doc = buildInvoiceDoc(client, session, ifhp, rate, invoiceNumber);
  const filename = invoiceFilename(client, session);

  if(ifhp){
    session.lastInvoiceNumber = invoiceNumber;
    saveState();
  }

  if(action === 'save'){
    doc.save(filename);
  }else if(action === 'share'){
    shareInvoiceFile(doc, filename, client);
  }else if(action === 'email'){
    const { email, subject, body } = receiptEmailContent(client, session);
    window.location.href = email ? `mailto:${email}?subject=${subject}&body=${body}` : `mailto:?subject=${subject}&body=${body}`;
  }else if(action === 'gmail'){
    createGmailDraftWithAttachment(client, session, doc, filename);
  }
}

function receiptEmailContent(client, session){
  const email = (client.profile && client.profile.email) ? encodeURIComponent(client.profile.email.trim()) : '';
  const subject = encodeURIComponent(`Your Receipt from ${getProvider().name} - ${formatInvoiceDate(session.date)}`);
  const body = encodeURIComponent(
    `Hello ${client.name},\n\n`+
    `Please find your receipt for the session on ${formatInvoiceDate(session.date)} attached.\n\n`+
    `Best regards,`
  );
  return { email, subject, body };
}

async function shareInvoiceFile(doc, filename, client){
  try{
    const blob = doc.output('blob');
    const file = new File([blob], filename, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: filename, text: `${client.name}` });
      return;
    }
  }catch(e){ /* user cancelled the share sheet */ }
  alert('Bu tarayıcı/cihaz dosya paylaşımını desteklemiyor. Bunun yerine "İndir" butonunu kullanabilirsin.');
}

function waLink(phone){
  const digits = (phone||'').replace(/[^\d]/g,'');
  return digits ? `https://wa.me/${digits}` : '#';

function gmailWebLink(email){
  const e = (email||'').trim();
  return e ? `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(e)}` : '#';
}

function mailtoLink(email){
  const e = (email||'').trim();
  return e ? `mailto:${e}` : '#';
}

function todayIso(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatShortDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function stars(n){
  return '⭐'.repeat(n) + '☆'.repeat(3-n);
}

let todoSortByClient = {};

function sortedTodos(todos, mode){
  const pending = todos.filter(t=>!t.done);
  const done = todos.filter(t=>t.done);
  if(mode === 'importance'){
    pending.sort((a,b)=> b.importance - a.importance || (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99'));
  }else{
    pending.sort((a,b)=> (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99') || (b.importance-a.importance));
  }
  done.sort((a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''));
  return { pending, done };
}

async function loadCalendarDayEvents(panel){
  const dateStr = panel.querySelector('.cal-date').value;
  const box = panel.querySelector('.cal-day-events');
  if(!dateStr){ box.textContent = 'Tarih seçince görünecek…'; return; }
  box.textContent = 'Yükleniyor…';
  const events = await fetchDayEvents(dateStr);
  if(events === null){
    box.textContent = 'Randevular yüklenemedi (Google bağlantısı gerekebilir).';
    return;
  }
  if(!events.length){
    box.innerHTML = `<div class="cal-day-empty">Bu günde mevcut randevu yok — boş.</div>`;
    return;
  }
  box.innerHTML = events.map(ev=>{
    const timeLabel = ev.start && ev.start.dateTime ? formatEventTime(ev.start.dateTime) : 'Tüm gün';
    return `<div class="cal-day-event-row"><span class="cal-day-event-time">${timeLabel}</span><span class="cal-day-event-title">${escapeHtml(ev.summary||'(başlıksız)')}</span></div>`;
  }).join('');
}

function wireTodoPanel(client){
  const panel = document.getElementById('todoPanel');
  const wasOpen = panel.classList.contains('open');

  const refresh = ()=>{
    renderMain();
    if(wasOpen) document.getElementById('todoPanel').classList.add('open');
  };

  panel.querySelector('.todo-add-btn').addEventListener('click', ()=>{
    const textInput = panel.querySelector('.todo-text');
    const text = textInput.value.trim();
    if(!text) return;
    const importance = Number(panel.querySelector('.todo-importance').value);
    const dueDate = panel.querySelector('.todo-duedate').value;
    client.todos = client.todos || [];
    client.todos.push({ id: uid(), text, importance, dueDate, done:false, doneAt:null });
    saveState();
    panel.classList.add('open');
    renderMain();
    document.getElementById('todoPanel').classList.add('open');

  panel.querySelector('.todo-sort-select').addEventListener('change', (ev)=>{

    panel.classList.add('open');
    renderMain();
    document.getElementById('todoPanel').classList.add('open');
  });

  panel.querySelectorAll('.todo-item').forEach(row=>{

    row.querySelector('.todo-check').addEventListener('change', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      todo.done = ev.target.checked;
      todo.doneAt = todo.done ? todayIso() : null;
      saveState();
      panel.classList.add('open');
      renderMain();
      document.getElementById('todoPanel').classList.add('open');
    });
    row.querySelector('.todo-item-text-input').addEventListener('blur', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      const val = ev.target.value.trim();
      if(val){ todo.text = val; saveState(); }
      else{ ev.target.value = todo.text; }
    });
    row.querySelector('.todo-item-importance-select').addEventListener('change', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      todo.importance = Number(ev.target.value);
      saveState();

      renderMain();
      document.getElementById('todoPanel').classList.add('open');

      const todo = client.todos.find(t=>t.id===id);

      saveState();

      renderMain();
      document.getElementById('todoPanel').classList.add('open');

    row.querySelector('.todo-del').addEventListener('click', ()=>{

function renderHome(){
  const main = document.getElementById('main');
  if(!state.generalTodos) state.generalTodos = [];

  const tasks = [];
  const doneTasks = [];
  state.clients.forEach(client=>{
    (client.todos||[]).forEach(t=>{
      if(!t.done) tasks.push({ clientId: client.id, clientName: client.name, todo:t });
      else doneTasks.push({ clientId: client.id, clientName: client.name, todo:t });
    });
  });
  state.generalTodos.forEach(t=>{
    if(!t.done) tasks.push({ clientId: null, clientName: null, todo:t });
    else doneTasks.push({ clientId: null, clientName: null, todo:t });
  });

  if(homeSortMode === 'importance'){
    tasks.sort((a,b)=> b.todo.importance - a.todo.importance || (a.todo.dueDate||'9999-99-99').localeCompare(b.todo.dueDate||'9999-99-99'));
  }else{
    tasks.sort((a,b)=> (a.todo.dueDate||'9999-99-99').localeCompare(b.todo.dueDate||'9999-99-99') || (b.todo.importance-a.todo.importance));
  }
  doneTasks.sort((a,b)=> (b.todo.doneAt||'').localeCompare(a.todo.doneAt||''));

  main.innerHTML = `
    <button class="back-to-list" id="backToListBtn">← Danışanlar</button>
    <div id="clientHeader"><h2>Yapılacaklar</h2></div>
    <div id="clientSub">${tasks.length} bekleyen iş, tüm danışanlar</div>
    <div class="todo-add-row">
      <input type="text" class="home-todo-text" placeholder="Yapılacak iş…">
      <select class="home-todo-importance">
        <option value="1">⭐ Düşük</option>
        <option value="2" selected>⭐⭐ Orta</option>
        <option value="3">⭐⭐⭐ Yüksek</option>
      </select>
      <input type="date" class="home-todo-duedate">
      <div class="client-picker">
        <input type="text" class="home-todo-client-search" placeholder="Danışan ara (opsiyonel)…" autocomplete="off">
        <input type="hidden" class="home-todo-client-id" value="">
        <div class="client-picker-list"></div>
      </div>
      <button class="home-todo-add-btn" type="button">Ekle</button>
    </div>
    <div class="home-sort-row">
      <label>Sırala</label>
      <select id="homeSortSelect">
        <option value="due" ${homeSortMode==='due'?'selected':''}>Son tarihe göre</option>
        <option value="importance" ${homeSortMode==='importance'?'selected':''}>Öneme göre</option>
      </select>
    </div>
    <div id="homeTaskList">
      ${tasks.length ? tasks.map(({clientId,clientName,todo})=>homeTaskRowHtml(clientId,clientName,todo)).join('') : '<div class="todo-empty">Hiç bekleyen iş yok.</div>'}
    </div>
    ${doneTasks.length ? `
    <div class="todo-done-header">Tamamlananlar (${doneTasks.length})</div>
    <div id="homeDoneTaskList">
      ${doneTasks.map(({clientId,clientName,todo})=>homeTaskRowHtml(clientId,clientName,todo)).join('')}
    </div>` : ''}
  `;

  document.getElementById('backToListBtn').addEventListener('click', ()=>{
    document.body.classList.remove('mobile-detail');
  });

  document.getElementById('homeSortSelect').addEventListener('change', (ev)=>{
    homeSortMode = ev.target.value;
    renderHome();
  });

  wireHomeClientPicker();

  document.querySelector('.home-todo-add-btn').addEventListener('click', ()=>{
    const textInput = document.querySelector('.home-todo-text');
    const text = textInput.value.trim();
    if(!text) return;
    const importance = Number(document.querySelector('.home-todo-importance').value);
    const dueDate = document.querySelector('.home-todo-duedate').value;
    const clientId = document.querySelector('.home-todo-client-id').value;
    const newTodo = { id: uid(), text, importance, dueDate, done:false, doneAt:null };
    if(clientId){
      const client = state.clients.find(c=>c.id===clientId);
      client.todos = client.todos || [];
      client.todos.push(newTodo);
    }else{
      state.generalTodos.push(newTodo);
    }
    saveState();
    renderHome();
  });

  document.querySelectorAll('.home-task-row').forEach(row=>{
    const clientId = row.getAttribute('data-client-id');
    const todoId = row.getAttribute('data-todo-id');
    row.querySelector('.home-task-check').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.done = ev.target.checked;
      todo.doneAt = todo.done ? todayIso() : null;
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-text-input').addEventListener('blur', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      const val = ev.target.value.trim();
      if(val){ todo.text = val; saveState(); }
      else{ ev.target.value = todo.text; }
    });
    row.querySelector('.home-task-importance-select').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.importance = Number(ev.target.value);
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-duedate-input').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.dueDate = ev.target.value;
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-del').addEventListener('click', ()=>{
      if(!confirm('Bu iş silinsin mi?')) return;
      if(clientId){
        const client = state.clients.find(c=>c.id===clientId);
        client.todos = client.todos.filter(t=>t.id!==todoId);
      }else{
        state.generalTodos = state.generalTodos.filter(t=>t.id!==todoId);
      }
      saveState();
      renderHome();
    });
    const clientBadge = row.querySelector('.home-task-client');
    if(clientBadge){
      clientBadge.addEventListener('click', ()=>{
        activeClientId = clientId;
        mainView = 'client';
        document.body.classList.add('mobile-detail');
        render();
      });
    }
  });
}

function wireHomeClientPicker(){
  const wrap = document.querySelector('.client-picker');
  const searchInput = wrap.querySelector('.home-todo-client-search');
  const hiddenId = wrap.querySelector('.home-todo-client-id');
  const listEl = wrap.querySelector('.client-picker-list');

  function renderOptions(query){
    const q = normalizeForSearch(query.trim());
    const matches = q ? state.clients.filter(c=>normalizeForSearch(c.name).includes(q)) : state.clients;
    listEl.innerHTML = matches.length
      ? matches.map(c=>`<div class="client-picker-item" data-id="${c.id}">${escapeHtml(c.name)}</div>`).join('')
      : `<div class="client-picker-empty">Eşleşme yok</div>`;
    listEl.querySelectorAll('.client-picker-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        hiddenId.value = item.getAttribute('data-id');
        searchInput.value = item.textContent;
        listEl.classList.remove('open');
      });
    });
  }

  searchInput.addEventListener('focus', ()=>{
    renderOptions(searchInput.value);
    listEl.classList.add('open');
  });
  searchInput.addEventListener('input', ()=>{
    hiddenId.value = '';
    renderOptions(searchInput.value);
    listEl.classList.add('open');
  });
  document.addEventListener('click', (ev)=>{
    if(!ev.target.closest('.client-picker')) listEl.classList.remove('open');
  });
}

function homeTaskRowHtml(clientId, clientName, todo){
  const overdue = !todo.done && todo.dueDate && todo.dueDate < todayIso();
  return `
  <div class="home-task-row ${todo.done?'done':''}" data-client-id="${clientId||''}" data-todo-id="${todo.id}">
    <input type="checkbox" class="home-task-check" ${todo.done?'checked':''}>
    <div class="home-task-main">
      <input type="text" class="home-task-text-input" value="${escapeAttr(todo.text)}">
      <div class="home-task-meta">
        ${clientName ? `<span class="home-task-client">${escapeHtml(clientName)}</span>` : `<span class="home-task-general">Genel</span>`}
        <select class="home-task-importance-select">
          <option value="1" ${todo.importance===1?'selected':''}>⭐ Düşük</option>
          <option value="2" ${todo.importance===2?'selected':''}>⭐⭐ Orta</option>
          <option value="3" ${todo.importance===3?'selected':''}>⭐⭐⭐ Yüksek</option>
        </select>
        <input type="date" class="home-task-duedate-input ${overdue?'overdue':''}" value="${todo.dueDate||''}">
      </div>
    </div>
    <button class="home-task-del" title="Sil">✕</button>
  </div>`;
}

init();
</script>
