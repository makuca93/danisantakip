<style>
  :root{
    --ink:#2b2d33;
    --muted:#6b6f78;
    --card:#ffffff;
    --card-line:#e2e2ea;
    --paper:#fbfafc;
    --highlight:#d9e3f0;
    --highlight-line:#c3d3e6;
    --grad-start:#dfe7f4;
    --grad-end:#f6e3ea;
    --red:#c15a6b;
    --red-bg:#f8e2e6;
    --green:#4f8f7c;
    --green-bg:#e2f0ea;
    --neutral:#b7bcc2;
    --neutral-bg:#eef0f2;
    --pink:#f0c7d4;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
    margin:0;
    overflow:hidden;
  }
  body{
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    background:var(--paper);
  }
  h1,h2,h3,.brand{font-family:'Fraunces', serif;}

  .file-setup{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--grad-start) 0%, var(--grad-end) 100%);
    z-index:50;
    padding:20px;
  }
  .setup-box{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:32px 36px;
    max-width:420px;
    text-align:center;
  }
  .setup-box h2{margin:0 0 10px; font-size:21px;}
  .setup-box p{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.55;}
  .setup-box .filename{font-weight:600; color:var(--ink);}
  .setup-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .setup-actions button{
    padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:13.5px;
    background:var(--highlight); color:var(--ink);
  }
  .setup-actions button.secondary{
    background:none; border:1px solid var(--card-line); color:var(--muted);
  }
  .setup-actions button:hover{filter:brightness(0.97);}

  #appShell{
    display:none;
    height:100vh;
  }
  #appShell.visible{display:flex;}

  #sidebar{
    width:280px;
    flex-shrink:0;
    background:linear-gradient(165deg, var(--grad-start) 0%, var(--grad-end) 100%);
    color:var(--ink);
    border-right:1px solid var(--card-line);
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{
    font-size:21px;
    font-weight:600;
    letter-spacing:0.2px;
    color:var(--ink);
  }
  .brand small{
    display:block;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:10.5px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:0.8px;
    text-transform:uppercase;
    margin-top:4px;
  }
  #addClientForm{
    display:flex;
    gap:6px;
  }
  #newClientName{
    flex:1;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid var(--card-line);
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
  }
  #newClientName::placeholder{color:var(--muted);}
  .search-empty{
    color:var(--muted);
    font-size:12.5px;
    font-style:italic;
    padding:10px 4px;
    line-height:1.5;
  }
  #addClientForm button{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-weight:600;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    font-size:13px;
  }
  #addClientForm button:hover{filter:brightness(0.97);}
  .sort-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  .sort-row select{
    flex:1;
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    border:1px solid var(--card-line);
    border-radius:6px;
    padding:5px 6px;
    font-family:inherit;
    font-size:12.5px;
  }
  #clientList{
    list-style:none;
    margin:0;
    padding:0;
    overflow-y:auto;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .client-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .client-row:hover{background:rgba(255,255,255,0.55);}
  .client-row.active{background:var(--highlight); border-color:var(--highlight-line);}
  .seal{
    width:12px;height:12px;border-radius:50%;
    flex-shrink:0;
    box-shadow:0 0 0 3px rgba(43,45,51,0.05);
  }
  .seal.red{background:var(--red);}
  .seal.green{background:var(--green);}
  .seal.neutral{background:var(--neutral);}
  .client-name{
    flex:1;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .client-del{
    opacity:0;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
  .client-edit{
    opacity:0;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
  .client-row:hover .client-del,
  .client-row:hover .client-edit{opacity:0.7;}
  .client-del:hover{opacity:1 !important; color:var(--red);}
  .client-edit:hover{opacity:1 !important; color:var(--ink);}
  .client-name-input{
    flex:1;
    font-family:inherit;
    font-size:14px;
    padding:4px 6px;
    border-radius:5px;
    border:1px solid var(--highlight-line);
    background:#ffffff;
    color:var(--ink);
  }
  #sidebarFooter{
    margin-top:auto;
    padding-top:12px;
    border-top:1px solid var(--card-line);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  #fileStatus{
    font-size:11px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #fileStatus .dot{
    display:inline-block; width:7px;height:7px;border-radius:50%;
    background:var(--green); margin-right:6px;
  }
  #manualSaveBtn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-family:inherit;
  }
  #manualSaveBtn:hover{filter:brightness(0.97);}

  #backupsBtn, #importJsonBtn{
    background:none;
    border:1px solid var(--card-line);
    color:var(--muted);
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-family:inherit;
    display:block;
    text-align:center;
    box-sizing:border-box;
  }
  #importJsonBtn:hover{color:var(--ink); border-color:var(--highlight-line);}
  #backupsBtn:hover{color:var(--ink); border-color:var(--highlight-line);}

  .backups-modal{
    display:none;
    position:fixed; inset:0;
    background:rgba(43,45,51,0.35);
    z-index:60;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .backups-modal.open{display:flex;}
  .backups-box{
    background:var(--card);
    border-radius:14px;
    max-width:480px;
    width:100%;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .backups-box-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 10px;
  }
  .backups-box-header h2{margin:0; font-size:19px;}
  .backups-box-header button{
    background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:2px 6px;
  }
  .backups-box-header button:hover{color:var(--red);}
  .backups-note{
    margin:0 20px 12px;
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
  }
  #backupsList{
    overflow-y:auto;
    padding:0 20px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .backup-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--card-line);
    border-radius:8px;
  }
  .backup-row-info{font-size:13px; color:var(--ink);}
  .backup-row-info small{display:block; color:var(--muted); font-size:11px; margin-top:2px;}
  .backup-restore-btn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .backup-restore-btn:hover{filter:brightness(0.97);}
  .backups-empty{color:var(--muted); font-size:13px; font-style:italic; padding:8px 0;}
  #changeFileBtn, #resetAllBtn{
    background:rgba(255,255,255,0.5);
    border:1px solid var(--card-line);
    color:var(--muted);
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-family:inherit;
  }
  #changeFileBtn:hover{color:var(--ink); border-color:var(--highlight-line);}
  #resetAllBtn:hover{color:var(--red); border-color:var(--red);}

  #main{
    flex:1;
    min-height:0;
    padding:32px 40px;
    overflow-y:auto;
    background:var(--paper);
  }
  #emptyState{
    color:var(--muted);
    font-size:15px;
    max-width:420px;
    margin-top:60px;
  }
  #emptyState h2{margin-bottom:8px; font-size:22px;}
  #clientHeader{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:6px;
  }
  #clientHeader h2{font-size:28px; margin:0;}
  .status-pill{
    font-size:12px;
    font-weight:500;
    padding:3px 10px;
    border-radius:20px;
  }
  .status-pill.red{background:var(--red-bg); color:var(--red);}
  .status-pill.green{background:var(--green-bg); color:var(--green);}
  .status-pill.neutral{background:var(--neutral-bg); color:var(--muted);}
  #clientSub{color:var(--muted); font-size:13px; margin-bottom:24px;}

  .add-session-toggle{
    background:var(--highlight);
    color:var(--ink);
    border:1px solid var(--highlight-line);
    padding:10px 16px;
    border-radius:8px;
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:22px;
  }
  .add-session-toggle:hover{filter:brightness(0.97);}

  .action-row{display:flex; gap:10px; margin-bottom:22px;}
  .action-row .add-session-toggle{margin-bottom:0;}

  .general-admin-note-block{margin-bottom:20px;}
  .general-admin-note-block .item-label{display:block; margin-bottom:5px;}
  .general-admin-note{
    width:100%;
    font-family:inherit;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--card-line);
    border-radius:8px;
    background:var(--card);
    resize:vertical;
    min-height:56px;
  }

  #todoPanel{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:12px;
    padding:20px;
    margin-bottom:26px;
    display:none;
  }
  #todoPanel.open{display:block;}
  .todo-add-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .todo-add-row .todo-text{flex:2; min-width:140px;}
  .todo-add-row select,
  .todo-add-row input{
    font-family:inherit;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--card-line);
    border-radius:6px;
    background:#fdfcfd;
  }
  .todo-add-row .todo-importance{flex:1; min-width:110px;}
  .todo-add-row .todo-duedate{flex:1; min-width:130px;}
  .todo-add-row .home-todo-client{flex:1; min-width:150px;}
  .client-picker{position:relative; flex:1; min-width:150px;}
  .client-picker input[type="text"]{
    width:100%;
    font-family:inherit;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--card-line);
    border-radius:6px;
    background:#fdfcfd;
  }
  .client-picker-list{
    display:none;
    position:absolute;
    left:0; right:0;
    top:calc(100% + 4px);
    max-height:180px;
    overflow-y:auto;
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:8px;
    box-shadow:0 6px 18px rgba(43,45,51,0.12);
    z-index:6;
  }
  .client-picker-list.open{display:block;}
  .client-picker-item{
    padding:8px 12px;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .client-picker-item:hover{background:var(--highlight);}
  .client-picker-empty{padding:8px 12px; font-size:13px; color:var(--muted); font-style:italic;}
  .todo-add-btn, .home-todo-add-btn{
    padding:8px 16px;
    border-radius:6px;
    border:none;
    background:var(--green);
    color:#fff;
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
  .todo-add-btn:hover, .home-todo-add-btn:hover{filter:brightness(1.08);}
  .todo-sort-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
    margin-bottom:12px;
  }
  .todo-sort-row select{
    font-family:inherit;
    font-size:12.5px;
    padding:5px 8px;
    border:1px solid var(--card-line);
    border-radius:6px;
    background:#fdfcfd;
  }
  .todo-list{display:flex; flex-direction:column; gap:2px;}
  .todo-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 4px;
    border-bottom:1px dashed var(--card-line);
  }
  .todo-item:last-child{border-bottom:none;}
  .todo-item input[type="checkbox"]{width:17px; height:17px; margin-top:2px; accent-color:var(--green); flex-shrink:0;}
  .todo-item-main{flex:1; min-width:0;}
  .todo-item-text-input{
    width:100%;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    border:1px solid transparent;
    background:transparent;
    border-radius:5px;
    padding:2px 4px;
  }
  .todo-item-text-input:hover, .todo-item-text-input:focus{
    border-color:var(--card-line);
    background:#fdfcfd;
  }
  .todo-item.done .todo-item-text-input{text-decoration:line-through; color:var(--muted);}
  .todo-item-meta{display:flex; align-items:center; gap:8px; margin-top:3px;}
  .todo-item-importance-select{
    font-family:inherit;
    font-size:11px;
    color:var(--muted);
    background:var(--neutral-bg);
    border:1px solid transparent;
    border-radius:10px;
    padding:2px 6px;
  }
  .todo-item-importance-select:hover, .todo-item-importance-select:focus{border-color:var(--card-line);}
  .todo-item-duedate-input{
    font-family:inherit;
    font-size:11px;
    color:var(--muted);
    background:var(--neutral-bg);
    border:1px solid transparent;
    border-radius:10px;
    padding:2px 6px;
  }
  .todo-item-duedate-input:hover, .todo-item-duedate-input:focus{border-color:var(--card-line);}
  .todo-item-duedate-input.overdue{background:var(--red-bg); color:var(--red);}
  .todo-del{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 4px;}
  .todo-del:hover{color:var(--red);}
  .todo-empty{color:var(--muted); font-size:13px; font-style:italic; padding:6px 4px;}
  .todo-done-header{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.3px;
    margin:14px 0 6px;
  }

  #homeNavBtn, #providerNavBtn{
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:1px solid transparent;
    border-radius:8px;
    padding:9px 10px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  #homeNavBtn:hover, #providerNavBtn:hover{background:rgba(255,255,255,0.55);}
  #homeNavBtn.active, #providerNavBtn.active{background:var(--highlight); border-color:var(--highlight-line);}

  .home-sort-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:18px;}
  .home-sort-row select{
    font-family:inherit; font-size:13px; padding:6px 10px;
    border:1px solid var(--card-line); border-radius:6px; background:var(--card);
  }
  .home-task-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:10px;
    margin-bottom:8px;
  }
  .home-task-row input[type="checkbox"]{width:17px; height:17px; margin-top:2px; accent-color:var(--green); flex-shrink:0;}
  .home-task-main{flex:1; min-width:0;}
  .home-task-text-input{
    width:100%;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    border:1px solid transparent;
    background:transparent;
    border-radius:5px;
    padding:2px 4px;
  }
  .home-task-text-input:hover, .home-task-text-input:focus{
    border-color:var(--card-line);
    background:#fdfcfd;
  }
  .home-task-row.done .home-task-text-input{text-decoration:line-through; color:var(--muted);}
  .home-task-meta{display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap;}
  .home-task-client{
    font-size:12px; font-weight:600; color:var(--ink);
    background:var(--highlight); padding:2px 9px; border-radius:10px; cursor:pointer;
  }
  .home-task-client:hover{filter:brightness(0.97);}
  .home-task-general{
    font-size:12px; font-weight:600; color:var(--muted);
    background:var(--neutral-bg); padding:2px 9px; border-radius:10px;
  }

<script>
/* ---------- IndexedDB: remember the picked file handle + rolling backups ---------- */
const IDB_NAME = 'danisan-takip-db';
const IDB_STORE = 'handles';
const IDB_BACKUP_STORE = 'backups';
const MAX_BACKUPS = 30;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){ db.createObjectStore(IDB_STORE); }
      if(!db.objectStoreNames.contains(IDB_BACKUP_STORE)){
        db.createObjectStore(IDB_BACKUP_STORE, { keyPath:'timestamp' });
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

async function saveBackupSnapshot(stateObj){
  try{
    const db = await idbOpen();
    const snapshot = { timestamp: Date.now(), data: JSON.stringify(stateObj) };
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_BACKUP_STORE,'readwrite');
      tx.objectStore(IDB_BACKUP_STORE).put(snapshot);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
    await pruneBackups(db);
  }catch(e){ console.error('Yedek kaydedilemedi', e); }
}

async function pruneBackups(db){
  return new Promise((resolve)=>{
    const tx = db.transaction(IDB_BACKUP_STORE,'readwrite');
    const store = tx.objectStore(IDB_BACKUP_STORE);
    const req = store.getAllKeys();
    req.onsuccess = ()=>{
      const keys = req.result.sort((a,b)=>a-b);
      const excess = keys.length - MAX_BACKUPS;
      if(excess > 0){
        for(let i=0;i<excess;i++){ store.delete(keys[i]); }
      }
      resolve();
    };
  });
}

async function listBackups(){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_BACKUP_STORE,'readonly');
    const req = tx.objectStore(IDB_BACKUP_STORE).getAll();
    req.onsuccess = ()=>resolve((req.result||[]).sort((a,b)=>b.timestamp-a.timestamp));
    req.onerror = ()=>reject(req.error);
  });
}

/* ---------- Auth + live data sync (Firebase) ---------- */
let currentUser = null;
let unsubscribeSnapshot = null;
let hasLoadedOnce = false;
let state = null;
let activeClientId = null;
let editingClientId = null;
let sortMode = 'default';
let searchQuery = '';
let mainView = 'client';
let homeSortMode = 'due';

function init(){
  window.addEventListener('fb-ready', startAuthListener);
  if(window.FB) startAuthListener();
}

function startAuthListener(){
  window.FB.getRedirectResult(window.FB.auth).catch((e)=>{
    console.error('Redirect giriş hatası', e);
  });
  window.FB.onAuthStateChanged(window.FB.auth, (user)=>{
    if(user){
      currentUser = user;
      hasLoadedOnce = false;
      subscribeToData();
    }else{
      currentUser = null;
      if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
      document.getElementById('appShell').classList.remove('visible');
      document.getElementById('fileSetup').style.display = 'flex';
      showSignInScreen();
    }
  });
}

function showSignInScreen(){
  setupBoxContent.innerHTML = `
    <h2>Giriş yap</h2>
    <p>Danışan verilerine erişmek için Google hesabınla giriş yapman gerekiyor.</p>
    <div class="setup-actions">
      <button id="googleSignInBtn">Google ile Giriş Yap</button>
    </div>`;
  document.getElementById('googleSignInBtn').addEventListener('click', async ()=>{
    try{
      await window.FB.signInWithRedirect(window.FB.auth, window.FB.provider);
    }catch(e){
      alert('Giriş başarısız: ' + e.message);
    }
  });
}

function subscribeToData(){
  const ref = window.FB.doc(window.FB.db, 'users', currentUser.uid, 'appdata', 'main');
  unsubscribeSnapshot = window.FB.onSnapshot(ref, (snap)=>{
    if(snap.exists()){
      state = snap.data();
    }else{
      state = exampleData();
    }
    if(!state.clients) state.clients = [];
    if(!state.generalTodos) state.generalTodos = [];

    if(!hasLoadedOnce){
      hasLoadedOnce = true;
      finishSetup();
    }else{
      render();
    }
  }, (err)=>{
    console.error('Senkron hatası', err);
    setupBoxContent.innerHTML = `<h2>Bağlantı hatası</h2><p>${escapeHtml(err.message)}</p>`;
    document.getElementById('appShell').classList.remove('visible');
    document.getElementById('fileSetup').style.display = 'flex';
  });
}

function finishSetup(){
  document.getElementById('fileSetup').style.display = 'none';
  document.getElementById('appShell').classList.add('visible');
  document.getElementById('fileStatus').innerHTML = `<span class="dot"></span>${escapeHtml(currentUser.email || currentUser.displayName || 'Google hesabı')}`;
  if(!activeClientId && state.clients.length){ activeClientId = state.clients[0].id; }
  lastBackupTime = Date.now();
  saveBackupSnapshot(state);
  render();
}

let lastBackupTime = 0;
const BACKUP_INTERVAL_MS = 3 * 60 * 1000; // at most one snapshot every 3 minutes

function maybeSnapshotBackup(){
  const now = Date.now();
  if(now - lastBackupTime > BACKUP_INTERVAL_MS){
    lastBackupTime = now;
    saveBackupSnapshot(state);
  }
}

async function saveState(){
  maybeSnapshotBackup();
  if(!currentUser) return;
  try{
    const ref = window.FB.doc(window.FB.db, 'users', currentUser.uid, 'appdata', 'main');
    await window.FB.setDoc(ref, JSON.parse(JSON.stringify(state)));
  }catch(e){
    console.error('Kaydetme hatası', e);
  }
}

document.getElementById('importJsonInput').addEventListener('change', async (ev)=>{
  const file = ev.target.files[0];

  if(!file) return;
  let imported;
  try{
    const text = await file.text();
    imported = JSON.parse(text);
  }catch(e){
    alert('Dosya okunamadı. Geçerli bir JSON dosyası seçtiğinden emin ol.');
    return;
  }
  const importedClients = Array.isArray(imported.clients) ? imported.clients : [];
  const importedTodos = Array.isArray(imported.generalTodos) ? imported.generalTodos : [];
  if(!importedClients.length && !importedTodos.length){
    alert('Bu dosyada içe aktarılacak danışan bulunamadı.');
    return;
  }
  if(!confirm(`${importedClients.length} danışan bu hesaba eklenecek. Mevcut verilerin üzerine yazılmaz, üstüne eklenir. Devam edilsin mi?`)) return;

  importedClients.forEach(c=>{
    if(!c.id) c.id = uid();
    if(!c.todos) c.todos = [];
    if(c.generalAdminNote == null) c.generalAdminNote = '';
    if(!c.profile) c.profile = { info:'', address:'', phone:'', email:'', ifhp:false, rate:null };
    (c.sessions||[]).forEach(s=>{ if(!s.id) s.id = uid(); });
  });
  importedTodos.forEach(t=>{ if(!t.id) t.id = uid(); });

  state.clients = [...state.clients, ...importedClients];
  state.generalTodos = [...(state.generalTodos||[]), ...importedTodos];
  if(!activeClientId && state.clients.length){ activeClientId = state.clients[0].id; }
  saveState();
  render();
  alert(`${importedClients.length} danışan başarıyla içe aktarıldı.`);
});
document.getElementById('closeBackupsBtn').addEventListener('click', closeBackupsModal);
document.getElementById('backupsModal').addEventListener('click', (ev)=>{

function formatBackupTime(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  const modal = document.getElementById('backupsModal');
  const list = document.getElementById('backupsList');

    return;
  }

  list.innerHTML = backups.map(b=>{
    let clientCount = '?';
    try{ clientCount = (JSON.parse(b.data).clients || []).length; }catch(e){}
    return `
    <div class="backup-row" data-ts="${b.timestamp}">
      <div class="backup-row-info">
        ${formatBackupTime(b.timestamp)}
        <small>${clientCount} danışan</small>
      </div>
      <button class="backup-restore-btn" type="button">Geri Yükle</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.backup-row').forEach(row=>{
    const ts = Number(row.getAttribute('data-ts'));
    row.querySelector('.backup-restore-btn').addEventListener('click', async ()=>{
      if(!confirm(`${formatBackupTime(ts)} tarihli yedeğe dönülsün mü? Şu anki veriler bu yedeğin üzerine yazılacak.`)) return;
      const backups2 = await listBackups();
      const match = backups2.find(b=>b.timestamp===ts);
      if(!match){ alert('Yedek bulunamadı.'); return; }
      try{
        state = JSON.parse(match.data);
      }catch(e){
        alert('Yedek okunamadı.');
        return;
      }
      saveState();
      closeBackupsModal();
      render();
    });
  });
}

/* ---------- Data model ---------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function exampleData(){
  return {
    clients: [],
    generalTodos: []
  };
}

function clientStatus(client){
  if(!client.sessions.length) return 'neutral';
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  for(const s of client.sessions){
    const invoiceOk = noInvoice ? true : s.invoiceDone;
    if(!(s.paymentDone && invoiceOk && s.notesDone && s.nextDone)){
      return 'red';
    }
  }
  return 'green';
}

function lastSessionDate(client){
  let max = null;
  client.sessions.forEach(s=>{
    if(s.date && (!max || s.date > max)) max = s.date;
  });
  return max;
}

function getSortedClients(){
  let arr = [...state.clients];
  if(sortMode === 'name'){
    arr.sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  } else if(sortMode === 'lastSession'){
    arr.sort((a,b)=>{
      const da = lastSessionDate(a);
      const db = lastSessionDate(b);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return db.localeCompare(da);
    });
  }
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLocaleLowerCase('tr');
    arr = arr.filter(c=>c.name.toLocaleLowerCase('tr').includes(q));
  }
  return arr;
}

/* ---------- Rendering ---------- */
function render(){
  renderSidebar();
  if(mainView === 'home'){
    renderHome();
  }else if(mainView === 'provider'){
    renderProviderPage();
  }else{
    renderMain();
  }
}

function renderSidebar(){
  document.getElementById('homeNavBtn').classList.toggle('active', mainView==='home');
  document.getElementById('providerNavBtn').classList.toggle('active', mainView==='provider');
  const list = document.getElementById('clientList');
  list.innerHTML = '';
  const clients = getSortedClients();

  if(!clients.length && searchQuery.trim()){
    const li = document.createElement('li');
    li.className = 'search-empty';
    li.textContent = `Eşleşme yok — "Ekle" ile yeni danışan olarak ekleyebilirsin.`;
    list.appendChild(li);
    return;
  }

  clients.forEach(client=>{
    const li = document.createElement('li');
    li.className = 'client-row' + (mainView==='client' && client.id===activeClientId ? ' active' : '');
    const status = clientStatus(client);

    if(client.id === editingClientId){
      li.innerHTML = `
        <span class="seal ${status}"></span>
        <input type="text" class="client-name-input" value="${escapeAttr(client.name)}">
      `;
      const input = li.querySelector('.client-name-input');
      const commit = ()=>{
        const val = input.value.trim();
        if(val){ client.name = val; }
        editingClientId = null;
        saveState();
        render();
      };
      input.addEventListener('keydown', (ev)=>{
        if(ev.key==='Enter'){ commit(); }
        if(ev.key==='Escape'){ editingClientId = null; render(); }
      });
      input.addEventListener('blur', commit);
      list.appendChild(li);
      input.focus();
      input.select();
      return;
    }

    li.innerHTML = `
      <span class="seal ${status}"></span>
      <span class="client-name">${escapeHtml(client.name)}</span>
      <button class="client-edit" title="Adını düzenle">✎</button>
      <button class="client-del" title="Danışanı sil">✕</button>
    `;
    li.querySelector('.client-name').addEventListener('click', ()=>{ activeClientId = client.id; mainView='client'; document.body.classList.add('mobile-detail'); render(); });
    li.querySelector('.seal').addEventListener('click', ()=>{ activeClientId = client.id; mainView='client'; document.body.classList.add('mobile-detail'); render(); });
    li.querySelector('.client-edit').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      editingClientId = client.id;
      render();
    });
    li.querySelector('.client-del').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      if(confirm(`${client.name} silinsin mi? Bu işlem geri alınamaz.`)){
        state.clients = state.clients.filter(c=>c.id!==client.id);
        if(activeClientId===client.id){ activeClientId = state.clients.length ? state.clients[0].id : null; }
        saveState(); render();
      }
    });
    list.appendChild(li);
  });
}

function escapeAttr(str){
  return escapeHtml(str).replace(/"/g,'&quot;');
}

function escapeHtml(str){

}

const TR_MAP = { 'ç':'c','Ç':'C','ğ':'g','Ğ':'G','ı':'i','İ':'I','ö':'o','Ö':'O','ş':'s','Ş':'S','ü':'u','Ü':'U' };
function toAscii(str){
  return (str||'').replace(/[çÇğĞıİöÖşŞüÜ]/g, ch => TR_MAP[ch] || ch);
}

function formatInvoiceDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function invoiceFilename(client, session){
  const namePart = toAscii(client.name).replace(/\s+/g,'');
  let dd='00', mm='00', yy='00';
  if(session.date){
    const d = new Date(session.date + 'T00:00:00');
    dd = String(d.getDate()).padStart(2,'0');
    mm = String(d.getMonth()+1).padStart(2,'0');
    yy = String(d.getFullYear()).slice(-2);
  }
  return `Invoice-${namePart}${dd}.${mm}.${yy}.pdf`;
}

function generateInvoiceForSession(client, session, action){
  const ifhp = !!(client.profile && client.profile.ifhp);
  let rate;
  if(ifhp){
    rate = 205;
  }else{
    rate = client.profile ? Number(client.profile.rate) : NaN;
    if(!rate || rate <= 0){
      alert('Önce bu danışanın profiline seans ücretini girmelisin.');
      return;
    }
  }
  let invoiceNumber = '';
  if(ifhp){
    const entered = prompt('IFHP fatura numarasını gir:');
    if(!entered || !entered.trim()){
      alert('Fatura numarası girilmeden IFHP faturası oluşturulamaz.');
      return;
    }
    invoiceNumber = entered.trim();
  }

  const doc = buildInvoiceDoc(client, session, ifhp, rate, invoiceNumber);
  const filename = invoiceFilename(client, session);

  if(ifhp){
    session.lastInvoiceNumber = invoiceNumber;
    saveState();
  }

  if(action === 'save'){
    doc.save(filename);
  }else if(action === 'share'){
    shareInvoiceFile(doc, filename, client);
  }else if(action === 'email'){
    const { email, subject, body } = receiptEmailContent(client, session);
    window.location.href = email ? `mailto:${email}?subject=${subject}&body=${body}` : `mailto:?subject=${subject}&body=${body}`;
  }else if(action === 'gmail'){
    const { email, subject, body } = receiptEmailContent(client, session);
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}&body=${body}`, '_blank');
  }
}

function receiptEmailContent(client, session){
  const email = (client.profile && client.profile.email) ? encodeURIComponent(client.profile.email.trim()) : '';
  const subject = encodeURIComponent(`Your Receipt from ${getProvider().name} - ${formatInvoiceDate(session.date)}`);
  const body = encodeURIComponent(
    `Hello ${client.name},\n\n`+
    `Please find your receipt for the session on ${formatInvoiceDate(session.date)} attached.\n\n`+
    `Best regards,`
  );
  return { email, subject, body };
}

async function shareInvoiceFile(doc, filename, client){
  try{
    const blob = doc.output('blob');
    const file = new File([blob], filename, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: filename, text: `${client.name}` });
      return;
    }
  }catch(e){ /* user cancelled the share sheet */ }
  alert('Bu tarayıcı/cihaz dosya paylaşımını desteklemiyor. Bunun yerine "İndir" butonunu kullanabilirsin.');
}

function todayIso(){

}

function formatShortDate(iso){

}

function stars(n){

let todoSortByClient = {};

function sortedTodos(todos, mode){
  const pending = todos.filter(t=>!t.done);
  const done = todos.filter(t=>t.done);
  if(mode === 'importance'){
    pending.sort((a,b)=> b.importance - a.importance || (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99'));
  }else{
    pending.sort((a,b)=> (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99') || (b.importance-a.importance));
  }
  done.sort((a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''));
  return { pending, done };
}

function todoItemHtml(todo){
  const overdue = (!todo.done && todo.dueDate && todo.dueDate < todayIso());
  return `
  <div class="todo-item ${todo.done?'done':''}" data-id="${todo.id}">
    <input type="checkbox" class="todo-check" ${todo.done?'checked':''}>
    <div class="todo-item-main">
      <input type="text" class="todo-item-text-input" value="${escapeAttr(todo.text)}">
      <div class="todo-item-meta">
        <select class="todo-item-importance-select">
          <option value="1" ${todo.importance===1?'selected':''}>⭐ Düşük</option>
          <option value="2" ${todo.importance===2?'selected':''}>⭐⭐ Orta</option>
          <option value="3" ${todo.importance===3?'selected':''}>⭐⭐⭐ Yüksek</option>
        </select>
        <input type="date" class="todo-item-duedate-input ${overdue?'overdue':''}" value="${todo.dueDate||''}">
      </div>
    </div>
    <button class="todo-del" title="Sil">✕</button>
  </div>`;
}

function todoPanelHtml(client){
  const todos = client.todos || [];

}

function wireTodoPanel(client){
  const panel = document.getElementById('todoPanel');
  const wasOpen = panel.classList.contains('open');

  const refresh = ()=>{
    renderMain();
    if(wasOpen) document.getElementById('todoPanel').classList.add('open');
  };

  panel.querySelector('.todo-add-btn').addEventListener('click', ()=>{
    const textInput = panel.querySelector('.todo-text');
    const text = textInput.value.trim();
    if(!text) return;
    const importance = Number(panel.querySelector('.todo-importance').value);
    const dueDate = panel.querySelector('.todo-duedate').value;
    client.todos = client.todos || [];
    client.todos.push({ id: uid(), text, importance, dueDate, done:false, doneAt:null });
    saveState();
    panel.classList.add('open');
    renderMain();
    document.getElementById('todoPanel').classList.add('open');
  });

  panel.querySelector('.todo-sort-select').addEventListener('change', (ev)=>{
    todoSortByClient[client.id] = ev.target.value;
    panel.classList.add('open');
    renderMain();
    document.getElementById('todoPanel').classList.add('open');
  });

  panel.querySelectorAll('.todo-item').forEach(row=>{
    const id = row.getAttribute('data-id');
    row.querySelector('.todo-check').addEventListener('change', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      todo.done = ev.target.checked;
      todo.doneAt = todo.done ? todayIso() : null;
      saveState();
      panel.classList.add('open');
      renderMain();
      document.getElementById('todoPanel').classList.add('open');
    });
    row.querySelector('.todo-item-text-input').addEventListener('blur', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      const val = ev.target.value.trim();
      if(val){ todo.text = val; saveState(); }
      else{ ev.target.value = todo.text; }
    });
    row.querySelector('.todo-item-importance-select').addEventListener('change', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      todo.importance = Number(ev.target.value);
      saveState();
      panel.classList.add('open');
      renderMain();
      document.getElementById('todoPanel').classList.add('open');
    });
    row.querySelector('.todo-item-duedate-input').addEventListener('change', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      todo.dueDate = ev.target.value;
      saveState();
      panel.classList.add('open');
      renderMain();
      document.getElementById('todoPanel').classList.add('open');

function wireProfilePanel(client){
  if(!client.profile) client.profile = { info:'', address:'', phone:'', email:'', ifhp:false, rate:null };
  const panel = document.getElementById('profilePanel');

  panel.querySelector('.profile-info').addEventListener('blur', (ev)=>{
    client.profile.info = ev.target.value;
    saveState();
  });
  panel.querySelector('.profile-address').addEventListener('blur', (ev)=>{
    client.profile.address = ev.target.value;
    saveState();
  });

  const phoneInput = panel.querySelector('.profile-phone');
  const waBtn = panel.querySelector('.whatsapp-btn');
  phoneInput.addEventListener('input', (ev)=>{
    const val = ev.target.value;
    waBtn.href = waLink(val);
    waBtn.classList.toggle('disabled', !val.trim());
  });
  phoneInput.addEventListener('blur', (ev)=>{
    client.profile.phone = ev.target.value;
    saveState();
  });

  const emailInput = panel.querySelector('.profile-email');
  const gmailBtn = panel.querySelector('.gmail-btn');
  const mailtoBtn = panel.querySelector('.mailto-btn');
  emailInput.addEventListener('input', (ev)=>{
    const val = ev.target.value;
    gmailBtn.href = gmailWebLink(val);
    gmailBtn.classList.toggle('disabled', !val.trim());
    mailtoBtn.href = mailtoLink(val);
    mailtoBtn.classList.toggle('disabled', !val.trim());
  });
  emailInput.addEventListener('blur', (ev)=>{
    client.profile.email = ev.target.value;
    saveState();
  });

  const ifhpCb = panel.querySelector('.profile-ifhp');
  const rateInput = panel.querySelector('.profile-rate');
  ifhpCb.addEventListener('change', ()=>{
    client.profile.ifhp = ifhpCb.checked;
    rateInput.disabled = ifhpCb.checked;
    saveState();
  });
  rateInput.addEventListener('blur', ()=>{
    client.profile.rate = rateInput.value ? Number(rateInput.value) : null;
    saveState();
  });

  const noInvoiceCb = panel.querySelector('.profile-no-invoice');
  noInvoiceCb.addEventListener('change', ()=>{
    client.profile.noInvoice = noInvoiceCb.checked;
    saveState();
    document.getElementById('profilePanel').classList.add('open');
    renderMain();
    document.getElementById('profilePanel').classList.add('open');
  });
}

      </div>
    </div>`}
  `;
  div.querySelector('.session-del').addEventListener('click', ()=>{
    if(confirm('Bu kayıt silinsin mi?')){

  });
  div.querySelectorAll('.item-row input[type="checkbox"]:not([disabled])').forEach(cb=>{

  div.querySelector('.session-date-input').addEventListener('change', (ev)=>{

    saveState();
  });
  div.querySelector('.admin-note-input').addEventListener('blur', (ev)=>{

    });
    div.querySelector('.invoice-gmail-btn').addEventListener('click', ()=>{

    });

  return div;

      <span class="item-label">${label}</span>

}

  return `
    <div class="item-row">

function renderHome(){
  const main = document.getElementById('main');
  if(!state.generalTodos) state.generalTodos = [];

  const tasks = [];
  const doneTasks = [];
  state.clients.forEach(client=>{
    (client.todos||[]).forEach(t=>{
      if(!t.done) tasks.push({ clientId: client.id, clientName: client.name, todo:t });
      else doneTasks.push({ clientId: client.id, clientName: client.name, todo:t });
    });
  });
  state.generalTodos.forEach(t=>{
    if(!t.done) tasks.push({ clientId: null, clientName: null, todo:t });
    else doneTasks.push({ clientId: null, clientName: null, todo:t });
  });

  if(homeSortMode === 'importance'){
    tasks.sort((a,b)=> b.todo.importance - a.todo.importance || (a.todo.dueDate||'9999-99-99').localeCompare(b.todo.dueDate||'9999-99-99'));
  }else{
    tasks.sort((a,b)=> (a.todo.dueDate||'9999-99-99').localeCompare(b.todo.dueDate||'9999-99-99') || (b.todo.importance-a.todo.importance));
  }
  doneTasks.sort((a,b)=> (b.todo.doneAt||'').localeCompare(a.todo.doneAt||''));

  main.innerHTML = `
    <button class="back-to-list" id="backToListBtn">← Danışanlar</button>
    <div id="clientHeader"><h2>Ana Sayfa</h2></div>
    <div id="clientSub">${tasks.length} bekleyen iş, tüm danışanlar</div>
    <div class="todo-add-row">
      <input type="text" class="home-todo-text" placeholder="Yapılacak iş…">
      <select class="home-todo-importance">
        <option value="1">⭐ Düşük</option>
        <option value="2" selected>⭐⭐ Orta</option>
        <option value="3">⭐⭐⭐ Yüksek</option>
      </select>
      <input type="date" class="home-todo-duedate">
      <div class="client-picker">
        <input type="text" class="home-todo-client-search" placeholder="Danışan ara (opsiyonel)…" autocomplete="off">
        <input type="hidden" class="home-todo-client-id" value="">
        <div class="client-picker-list"></div>
      </div>
      <button class="home-todo-add-btn" type="button">Ekle</button>
    </div>
    <div class="home-sort-row">
      <label>Sırala</label>
      <select id="homeSortSelect">
        <option value="due" ${homeSortMode==='due'?'selected':''}>Son tarihe göre</option>
        <option value="importance" ${homeSortMode==='importance'?'selected':''}>Öneme göre</option>
      </select>
    </div>
    <div id="homeTaskList">
      ${tasks.length ? tasks.map(({clientId,clientName,todo})=>homeTaskRowHtml(clientId,clientName,todo)).join('') : '<div class="todo-empty">Hiç bekleyen iş yok.</div>'}
    </div>
    ${doneTasks.length ? `
    <div class="todo-done-header">Tamamlananlar (${doneTasks.length})</div>
    <div id="homeDoneTaskList">
      ${doneTasks.map(({clientId,clientName,todo})=>homeTaskRowHtml(clientId,clientName,todo)).join('')}
    </div>` : ''}
  `;

  document.getElementById('backToListBtn').addEventListener('click', ()=>{
    document.body.classList.remove('mobile-detail');
  });

  document.getElementById('homeSortSelect').addEventListener('change', (ev)=>{
    homeSortMode = ev.target.value;
    renderHome();
  });

  wireHomeClientPicker();

  document.querySelector('.home-todo-add-btn').addEventListener('click', ()=>{
    const textInput = document.querySelector('.home-todo-text');
    const text = textInput.value.trim();
    if(!text) return;
    const importance = Number(document.querySelector('.home-todo-importance').value);
    const dueDate = document.querySelector('.home-todo-duedate').value;
    const clientId = document.querySelector('.home-todo-client-id').value;
    const newTodo = { id: uid(), text, importance, dueDate, done:false, doneAt:null };
    if(clientId){
      const client = state.clients.find(c=>c.id===clientId);
      client.todos = client.todos || [];
      client.todos.push(newTodo);
    }else{
      state.generalTodos.push(newTodo);
    }
    saveState();
    renderHome();
  });

  document.querySelectorAll('.home-task-row').forEach(row=>{
    const clientId = row.getAttribute('data-client-id');
    const todoId = row.getAttribute('data-todo-id');
    row.querySelector('.home-task-check').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.done = ev.target.checked;
      todo.doneAt = todo.done ? todayIso() : null;
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-text-input').addEventListener('blur', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      const val = ev.target.value.trim();
      if(val){ todo.text = val; saveState(); }
      else{ ev.target.value = todo.text; }
    });
    row.querySelector('.home-task-importance-select').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.importance = Number(ev.target.value);
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-duedate-input').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.dueDate = ev.target.value;
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-del').addEventListener('click', ()=>{
      if(!confirm('Bu iş silinsin mi?')) return;
      if(clientId){
        const client = state.clients.find(c=>c.id===clientId);
        client.todos = client.todos.filter(t=>t.id!==todoId);
      }else{
        state.generalTodos = state.generalTodos.filter(t=>t.id!==todoId);
      }
      saveState();
      renderHome();
    });
    const clientBadge = row.querySelector('.home-task-client');
    if(clientBadge){
      clientBadge.addEventListener('click', ()=>{
        activeClientId = clientId;
        mainView = 'client';
        document.body.classList.add('mobile-detail');
        render();
      });
    }
  });
}

function wireHomeClientPicker(){
  const wrap = document.querySelector('.client-picker');
  const searchInput = wrap.querySelector('.home-todo-client-search');
  const hiddenId = wrap.querySelector('.home-todo-client-id');
  const listEl = wrap.querySelector('.client-picker-list');

  function renderOptions(query){
    const q = query.trim().toLocaleLowerCase('tr');
    const matches = q ? state.clients.filter(c=>c.name.toLocaleLowerCase('tr').includes(q)) : state.clients;
    listEl.innerHTML = matches.length
      ? matches.map(c=>`<div class="client-picker-item" data-id="${c.id}">${escapeHtml(c.name)}</div>`).join('')
      : `<div class="client-picker-empty">Eşleşme yok</div>`;
    listEl.querySelectorAll('.client-picker-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        hiddenId.value = item.getAttribute('data-id');
        searchInput.value = item.textContent;
        listEl.classList.remove('open');
      });
    });
  }

  searchInput.addEventListener('focus', ()=>{
    renderOptions(searchInput.value);
    listEl.classList.add('open');
  });
  searchInput.addEventListener('input', ()=>{
    hiddenId.value = '';
    renderOptions(searchInput.value);
    listEl.classList.add('open');
  });
  document.addEventListener('click', (ev)=>{
    if(!ev.target.closest('.client-picker')) listEl.classList.remove('open');
  });
}

function homeTaskRowHtml(clientId, clientName, todo){
  const overdue = !todo.done && todo.dueDate && todo.dueDate < todayIso();
  return `
  <div class="home-task-row ${todo.done?'done':''}" data-client-id="${clientId||''}" data-todo-id="${todo.id}">
    <input type="checkbox" class="home-task-check" ${todo.done?'checked':''}>
    <div class="home-task-main">
      <input type="text" class="home-task-text-input" value="${escapeAttr(todo.text)}">
      <div class="home-task-meta">
        ${clientName ? `<span class="home-task-client">${escapeHtml(clientName)}</span>` : `<span class="home-task-general">Genel</span>`}
        <select class="home-task-importance-select">
          <option value="1" ${todo.importance===1?'selected':''}>⭐ Düşük</option>
          <option value="2" ${todo.importance===2?'selected':''}>⭐⭐ Orta</option>
          <option value="3" ${todo.importance===3?'selected':''}>⭐⭐⭐ Yüksek</option>
        </select>
        <input type="date" class="home-task-duedate-input ${overdue?'overdue':''}" value="${todo.dueDate||''}">
      </div>
    </div>
    <button class="home-task-del" title="Sil">✕</button>
  </div>`;
}

init();
