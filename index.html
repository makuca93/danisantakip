let sessionCollapseOverrides = {};

function isSessionCollapsed(session, index){
  if(sessionCollapseOverrides.hasOwnProperty(session.id)) return sessionCollapseOverrides[session.id];
  return index !== 0;
}

function renderSessionCard(client, session, index){
  const div = document.createElement('div');
  div.className = `session-card ${session.noShow ? 'noshow' : ''}`;
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  const collapsed = isSessionCollapsed(session, index);
  const isFuture = !isSessionDue(session);
  const isCalendarLinked = !!session.calendarEventId;

  div.innerHTML = `
    <div class="session-card-top">
      <button class="session-collapse-toggle" type="button" title="Daralt/Genişlet">${collapsed ? '▸' : '▾'}</button>
      <input type="date" class="session-date-input" value="${session.date||''}">
      <button class="session-noshow-btn ${session.noShow?'active':''}" type="button" title="Danışan gelmedi olarak işaretle">🚫 ${session.noShow?'Gelmedi':'Gelmedi mi?'}</button>
      <button class="session-del">Sil</button>
    </div>
    ${isFuture ? `
    <div class="future-session-banner">
      <span>📅 Bu randevu henüz gerçekleşmedi${isCalendarLinked ? ' — Takvim ile bağlantılı' : ''}.</span>
      ${isCalendarLinked ? `
      <div class="future-session-actions">
        <button class="future-reschedule-btn" type="button">✏️ Yeniden Planla</button>
        <button class="future-cancel-btn" type="button">✕ İptal Et</button>
      </div>` : ''}
    </div>` : ''}
    <div class="session-card-body ${collapsed ? 'collapsed' : ''}">
    ${itemRow('Ödeme', boolLabel(session.paymentDone), 'paymentDone', session)}
    ${noInvoice ? `
    <div class="item-row invoice-blackout">
      <input type="checkbox" disabled>
      <span class="item-label">Fatura</span>
      <span class="item-value empty">Bu danışana fatura hazırlanmayacak</span>
    </div>` : itemRow('Fatura', boolLabel(session.invoiceDone), 'invoiceDone', session)}
    ${itemRow('Seans notları', boolLabel(session.notesDone), 'notesDone', session)}
    ${itemRowWithInput('Sonraki seans', 'nextDone', 'nextNote', session)}
    <div class="admin-notes-block">
      <label class="item-label">Admin notları</label>
      <textarea class="admin-note-input" placeholder="Bu danışanla ilgili yapılacak idari işler…">${escapeHtml(session.adminNote||'')}</textarea>
    </div>
    ${noInvoice ? `
    <div class="invoice-actions-blackout">Bu danışan için fatura/makbuz oluşturulmuyor</div>` : `
    <div class="invoice-actions-label">Fatura / Makbuz</div>
    <div class="invoice-actions">
      <button class="invoice-save-btn" type="button">📄 İndir</button>
      <button class="invoice-share-btn" type="button">📤 Gönder</button>
      <div class="invoice-email-group">
        <button class="invoice-email-btn" type="button" title="Mail programında aç">✉️ Email</button>
        <button class="invoice-gmail-btn" type="button" title="Gmail'de ekli taslak oluştur">📧 Gmail Taslağı</button>
      </div>
    </div>`}
    </div>
  `;

  const toggleCollapse = ()=>{
    const body = div.querySelector('.session-card-body');
    const nowCollapsed = !body.classList.contains('collapsed');
    body.classList.toggle('collapsed', nowCollapsed);
    div.querySelector('.session-collapse-toggle').textContent = nowCollapsed ? '▸' : '▾';
    sessionCollapseOverrides[session.id] = nowCollapsed;
  };
  div.querySelector('.session-collapse-toggle').addEventListener('click', (ev)=>{
    ev.stopPropagation();
    toggleCollapse();
  });
  div.querySelector('.session-card-top').addEventListener('click', (ev)=>{
    if(ev.target.closest('.session-date-input') || ev.target.closest('.session-del')) return;
    toggleCollapse();
  });

  div.querySelector('.session-del').addEventListener('click', ()=>{
    if(confirm('Bu kayıt silinsin mi?')){
      client.sessions = client.sessions.filter(s=>s.id!==session.id);
      saveState(); render();
    }
  });
  if(isFuture && isCalendarLinked){
    div.querySelector('.future-reschedule-btn').addEventListener('click', ()=>{
      openReschedulePopover({
        initialDate: session.date,
        initialTimeLabel: session.calendarEndTime ? formatEventTime(session.calendarEndTime) : '10:00 AM',
        onConfirm: async (newDate, newTimeLabel)=>{
          const newTime = parseAmPmTime(newTimeLabel);
          if(!newTime) return;
          const ok = await rescheduleCalendarEvent(session.calendarEventId, newDate, newTime, session.calendarId || 'primary');
          if(ok){
            session.date = newDate;
            saveState();
            render();
          }else{
            alert('Randevu güncellenemedi.');
          }
        }
      });
    });
    div.querySelector('.future-cancel-btn').addEventListener('click', async ()=>{
      if(!confirm('Bu randevu Takvim\'den iptal edilsin ve bu kayıt silinsin mi? Danışana bilgilendirme gider.')) return;
      const ok = await cancelCalendarEvent(session.calendarEventId, session.calendarId || 'primary');
      if(ok){
        client.sessions = client.sessions.filter(s=>s.id!==session.id);
        saveState();
        render();
      }else{
        alert('Randevu iptal edilemedi.');
      }
    });
  }
  div.querySelectorAll('.item-row input[type="checkbox"]:not([disabled])').forEach(cb=>{
    cb.addEventListener('change', (ev)=>{
      const key = ev.target.getAttribute('data-key');
      session[key] = ev.target.checked;
      saveState();
      render();
    });
  });
  div.querySelector('.inline-note-input').addEventListener('blur', (ev)=>{
    session.nextNote = ev.target.value;
    saveState();
  });
  div.querySelector('.session-date-input').addEventListener('change', (ev)=>{
    session.date = ev.target.value;
    saveState();
  });
  div.querySelector('.session-noshow-btn').addEventListener('click', ()=>{
    session.noShow = !session.noShow;
    saveState();
    render();
  });
  div.querySelector('.admin-note-input').addEventListener('blur', (ev)=>{
    session.adminNote = ev.target.value;
    saveState();
  });
  if(!noInvoice){
    div.querySelector('.invoice-save-btn').addEventListener('click', ()=>{
      generateInvoiceForSession(client, session, 'save');
    });
    div.querySelector('.invoice-share-btn').addEventListener('click', ()=>{
      generateInvoiceForSession(client, session, 'share');
    });
    div.querySelector('.invoice-email-btn').addEventListener('click', ()=>{
      generateInvoiceForSession(client, session, 'email');
    });
    div.querySelector('.invoice-gmail-btn').addEventListener('click', ()=>{
      generateInvoiceForSession(client, session, 'gmail');
    });
  }
  return div;
}

async function exportCurrentDataJson(){
  const jsonText = JSON.stringify(state, null, 2);
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const filename = `danisan-takip-yedek-${stamp}.json`;

  if('showSaveFilePicker' in window){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description:'JSON dosyası', accept:{'application/json':['.json']} }]
      });
      const writable = await handle.createWritable();
      await writable.write(jsonText);
      await writable.close();
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // user cancelled the picker
      console.error('Kaydetme penceresi başarısız, otomatik indirmeye geçiliyor', e);
    }
  }

  const blob = new Blob([jsonText], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function computePersonalStats(){
  const now = new Date();
  const thisMonthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const thisYearStr = String(now.getFullYear());
  let activeClients = 0, terminatedClients = 0;
  let sessionsThisMonth = 0, sessionsThisYear = 0, revenueThisMonth = 0;
  (state.clients||[]).forEach(c=>{
    if(c.profile && c.profile.terminated) terminatedClients++; else activeClients++;
    (c.sessions||[]).forEach(s=>{
      if(!s.date || !isSessionDue(s)) return;
      if(s.date.startsWith(thisMonthStr)){
        sessionsThisMonth++;
        if(s.paymentDone){
          const rate = (c.profile && c.profile.ifhp) ? (205 * 0.70) : (c.profile && c.profile.rate != null ? Number(c.profile.rate) : 0);
          revenueThisMonth += rate;
        }
      }
      if(s.date.startsWith(thisYearStr)) sessionsThisYear++;
    });
  });
  return { activeClients, terminatedClients, sessionsThisMonth, sessionsThisYear, revenueThisMonth, monthlyRevenue: computeMonthlyRevenue(12) };
}

function computeMonthlyRevenue(monthsBack){
  const now = new Date();
  const buckets = [];
  const monthNames = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  for(let i = monthsBack-1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: monthNames[d.getMonth()], total: 0 });
  }
  const bucketMap = {};
  buckets.forEach(b=>bucketMap[b.key]=b);
  (state.clients||[]).forEach(c=>{
    (c.sessions||[]).forEach(s=>{
      if(!s.date || !isSessionDue(s) || !s.paymentDone) return;
      const key = s.date.slice(0,7);
      if(bucketMap[key]){
        const rate = (c.profile && c.profile.ifhp) ? (205*0.70) : (c.profile && c.profile.rate != null ? Number(c.profile.rate) : 0);
        bucketMap[key].total += rate;
      }
    });
  });
  return buckets;
}

function getFilteredMonthlyRevenue(filter){
  const shared = (practiceState && practiceState.stats) || {};
  const me = currentPersonId();
  // Whichever bucket represents "my own" data is always computed live from local state (freshest);
  // the other person's data comes from what they last published to the shared doc.
  const myBuckets = computeMonthlyRevenue(12);
  const kubilayBuckets = (me === 'kubilay') ? myBuckets : (shared.kubilay && shared.kubilay.monthlyRevenue);
  const duyguBuckets = (me === 'duygu') ? myBuckets : (shared.duygu && shared.duygu.monthlyRevenue);

  if(filter === 'kubilay') return kubilayBuckets || null;
  if(filter === 'duygu') return duyguBuckets || null;
  // toplam
  if(!kubilayBuckets && !duyguBuckets) return null;
  const base = kubilayBuckets || duyguBuckets;
  return base.map((b,i)=>({
    key: b.key, label: b.label,
    total: (kubilayBuckets ? kubilayBuckets[i].total : 0) + (duyguBuckets ? duyguBuckets[i].total : 0)
  }));
}

function revenueChartSvg(filter){
  const buckets = getFilteredMonthlyRevenue(filter);
  if(!buckets){
    return `<div class="todo-empty">${filter==='kubilay'?'Kubilay':'Duygu'} henüz veri paylaşmadı.</div>`;
  }
  const max = Math.max(...buckets.map(b=>b.total), 1);
  const width = 600, height = 190, barGap = 6;
  const chartHeight = 130;
  const topPad = 24;
  const barWidth = (width - barGap*(buckets.length-1)) / buckets.length;
  const bars = buckets.map((b,i)=>{
    const barHeight = b.total > 0 ? Math.max(3, (b.total/max) * chartHeight) : 0;
    const x = i * (barWidth + barGap);
    const y = chartHeight - barHeight + topPad;
    const label = b.total > 0 ? `<text x="${(x+barWidth/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" font-weight="600" fill="#2b2d33" text-anchor="middle">${Math.round(b.total)}</text>` : '';
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barHeight.toFixed(1)}" rx="3" fill="#c7d4ea"><title>${b.label}: CA$${b.total.toFixed(0)}</title></rect>
      ${label}
      <text x="${(x+barWidth/2).toFixed(1)}" y="${height-8}" font-size="10" fill="#6b6f78" text-anchor="middle">${b.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${bars}</svg>`;
}

function practiceStatsHtml(){
  const shared = (practiceState && practiceState.stats) || {};
  const kubilay = shared.kubilay;
  const duygu = shared.duygu;

  function box(num, label){
    return `<div class="practice-stat-box"><div class="practice-stat-num">${num}</div><div class="practice-stat-label">${label}</div></div>`;
  }
  function staleness(entry){
    if(!entry || !entry.updatedAt) return '';
    const days = Math.floor((Date.now() - entry.updatedAt) / (24*60*60*1000));
    if(days <= 0) return '(bugün güncellendi)';
    return `(${days} gün önce güncellendi)`;
  }

  if(practiceStatsFilter === 'kubilay'){
    if(!kubilay) return `<div class="todo-empty">Kubilay henüz Yönetim sayfasını açıp veri paylaşmadı.</div>`;
    return `<p class="practice-stats-note">Kubilay ${staleness(kubilay)}</p><div class="practice-stats-grid">
      ${box(kubilay.activeClients,'Aktif danışan')}
      ${box(kubilay.terminatedClients,'Sonlanmış danışan')}
      ${box(kubilay.sessionsThisMonth,'Bu ay seans')}
      ${box(kubilay.sessionsThisYear,'Bu yıl seans')}
      ${box('CA$'+kubilay.revenueThisMonth.toFixed(0),'Bu ay tahsil edilen')}
    </div>`;
  }
  if(practiceStatsFilter === 'duygu'){
    if(!duygu) return `<div class="todo-empty">Duygu henüz Yönetim sayfasını açıp veri paylaşmadı.</div>`;
    return `<p class="practice-stats-note">Duygu ${staleness(duygu)}</p><div class="practice-stats-grid">
      ${box(duygu.activeClients,'Aktif danışan')}
      ${box(duygu.terminatedClients,'Sonlanmış danışan')}
      ${box(duygu.sessionsThisMonth,'Bu ay seans')}
      ${box(duygu.sessionsThisYear,'Bu yıl seans')}
      ${box('CA$'+duygu.revenueThisMonth.toFixed(0),'Bu ay tahsil edilen')}
    </div>`;
  }
  // toplam
  if(!kubilay && !duygu){
    return `<div class="todo-empty">Henüz hiçbir hesap veri paylaşmadı.</div>`;
  }
  const k = kubilay || { activeClients:0, terminatedClients:0, sessionsThisMonth:0, sessionsThisYear:0, revenueThisMonth:0 };
  const d = duygu || { activeClients:0, terminatedClients:0, sessionsThisMonth:0, sessionsThisYear:0, revenueThisMonth:0 };
  const missingNote = (!kubilay || !duygu) ? `<p class="practice-stats-note">${!kubilay?'Kubilay':'Duygu'} henüz veri paylaşmadı, toplam eksik olabilir.</p>` : '';
  return `${missingNote}<div class="practice-stats-grid">
    ${box(k.activeClients + d.activeClients,'Aktif danışan')}
    ${box(k.terminatedClients + d.terminatedClients,'Sonlanmış danışan')}
    ${box(k.sessionsThisMonth + d.sessionsThisMonth,'Bu ay seans')}
    ${box(k.sessionsThisYear + d.sessionsThisYear,'Bu yıl seans')}
    ${box('CA$'+(k.revenueThisMonth + d.revenueThisMonth).toFixed(0),'Bu ay tahsil edilen')}
  </div>`;
}

/* ---------- Faturalar arşivi (also covers year-end CSV export) ---------- */
let invoicesYearFilter = 'all';
let invoicesSearchQuery = '';

function collectInvoicedSessions(){
  const rows = [];
  (state.clients||[]).forEach(c=>{
    if(c.profile && c.profile.noInvoice) return;
    (c.sessions||[]).forEach(s=>{
      if(!s.invoiceDone) return;
      const rate = (c.profile && c.profile.ifhp) ? 205 : (c.profile && c.profile.rate != null ? Number(c.profile.rate) : 0);
      rows.push({ clientId: c.id, clientName: c.name, session: s, date: s.date, ifhp: !!(c.profile && c.profile.ifhp), rate });
    });
  });
  rows.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return rows;
}

function downloadInvoicesCsv(rows){
  const header = ['Tarih','Danışan','Tutar (CAD)','IFHP'];
  const lines = [header.join(',')];
  rows.forEach(r=>{
    lines.push([r.date||'', `"${(r.clientName||'').replace(/"/g,'""')}"`, r.rate.toFixed(2), r.ifhp ? 'Evet' : 'Hayır'].join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const yearLabel = invoicesYearFilter === 'all' ? 'tum-yillar' : invoicesYearFilter;
  a.href = url;
  a.download = `faturalar-${yearLabel}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderInvoicesPage(){
  const main = document.getElementById('main');
  const allRows = collectInvoicedSessions();
  const years = [...new Set(allRows.map(r=>r.date ? r.date.slice(0,4) : '').filter(Boolean))].sort().reverse();
  let rows = allRows;
  if(invoicesYearFilter !== 'all') rows = rows.filter(r=>r.date && r.date.startsWith(invoicesYearFilter));
  if(invoicesSearchQuery.trim()){
    const q = normalizeForSearch(invoicesSearchQuery);
    rows = rows.filter(r=>normalizeForSearch(r.clientName).includes(q));
  }
  const grandTotal = rows.reduce((sum,r)=>sum+r.rate, 0);

  main.innerHTML = `
    <button class="back-to-list" id="backToListBtn">← Danışanlar</button>

        ${owedListHtml()}
      </div>
    </div>

          <option value="all">Tüm yıllar</option>
          ${years.map(y=>`<option value="${y}" ${invoicesYearFilter===y?'selected':''}>${y}</option>`).join('')}
        </select>
        <input type="text" id="invoicesSearchInput" placeholder="Danışan ara…" value="${escapeAttr(invoicesSearchQuery)}">
        <button class="settings-btn" id="invoicesCsvBtn" style="width:auto;">📊 CSV İndir</button>
      </div>
      <div class="owed-total" style="margin-top:14px;">Toplam (${rows.length} fatura): <strong>CA$${grandTotal.toFixed(0)}</strong></div>
      <div class="invoices-bulk-row">

      </div>
      <div class="invoices-list" style="margin-top:10px;">
        ${rows.length ? rows.map(r => `
          <div class="invoice-row" data-client-id="${r.clientId}" data-session-id="${r.session.id}">
            <input type="checkbox" class="invoice-select-check">
            <div class="invoice-row-main">

            </div>
          </div>`).join('') : '<div class="todo-empty">Kayıt yok.</div>'}

      const checkedRows = Array.from(document.querySelectorAll('.invoice-select-check:checked')).map(cb=>cb.closest('.invoice-row'));
      if(!checkedRows.length) return;
      bulkBtn.disabled = true;
      const originalText = bulkBtn.innerHTML;
      for(let i=0; i<checkedRows.length; i++){
        bulkBtn.textContent = `İndiriliyor… (${i+1}/${checkedRows.length})`;
        const row = checkedRows[i];
        const clientId = row.getAttribute('data-client-id');
        const sessionId = row.getAttribute('data-session-id');
        const client = state.clients.find(c=>c.id===clientId);
        const session = client && client.sessions.find(s=>s.id===sessionId);
        if(client && session){
          await generateInvoiceForSession(client, session, 'save');
          await new Promise(r=>setTimeout(r, 400));
        }
      }
      bulkBtn.innerHTML = originalText;
      bulkBtn.disabled = false;
    });
  }
}

async function fetchUpcomingRangeEvents(days){
  const token = await getTokenSilentOnly();
  if(!token) return null;
  const startOfToday = new Date();
  startOfToday.setHours(0,0,0,0);
  const future = new Date(startOfToday.getTime() + days*24*60*60*1000);
  const calendarIds = ['primary'];
  const other = otherPersonEmail();
  if(other) calendarIds.push(other);
  try{
    const results = await Promise.all(calendarIds.map(async (calId)=>{
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?timeMin=${encodeURIComponent(startOfToday.toISOString())}&timeMax=${encodeURIComponent(future.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=100`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok) return [];
      const data = await res.json();
      return (data.items || []).map(ev => ({ ...ev, _calendarId: calId }));
    }));
    return results.flat().sort((a,b)=>{
      const sa = (a.start && (a.start.dateTime || a.start.date)) || '';
      const sb = (b.start && (b.start.dateTime || b.start.date)) || '';
      return sa.localeCompare(sb);
    });
  }catch(e){
    return null;
  }
}

let homeCalendarCache = null;

function computeUpcomingBirthdays(){
  const today = new Date();
  const results = [];
  (state.clients||[]).forEach(c=>{
    if(!c.profile || !c.profile.birthDate) return;
    if(c.profile.terminated) return;
    const bd = new Date(c.profile.birthDate + 'T00:00:00');
    const occurrenceThisYear = new Date(today.getFullYear(), bd.getMonth(), bd.getDate());
    const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let diffDays = Math.round((occurrenceThisYear - todayMidnight) / (24*60*60*1000));
    if(diffDays < 0){
      const occurrenceNextYear = new Date(today.getFullYear()+1, bd.getMonth(), bd.getDate());
      diffDays = Math.round((occurrenceNextYear - todayMidnight) / (24*60*60*1000));
    }
    if(diffDays <= 7){
      results.push({ id: c.id, name: c.name, diffDays });
    }
  });
  results.sort((a,b)=>a.diffDays-b.diffDays);
  return results;
}

function birthdayBannerHtml(){
  const upcoming = computeUpcomingBirthdays();
  if(!upcoming.length) return '';
  const items = upcoming.map(b=>{
    const label = b.diffDays === 0 ? '🎂 bugün' : b.diffDays === 1 ? 'yarın' : `${b.diffDays} gün sonra`;
    return `<span class="birthday-item cal-client-link" data-client-id="${b.id}">${escapeHtml(b.name)} <span class="birthday-when">(${label})</span></span>`;
  }).join('');
  return `<div class="birthday-banner">🎉 ${items}</div>`;
}

function computeOwedList(){
  const rows = [];
  (state.clients||[]).forEach(c=>{
    if(c.profile && c.profile.terminated) return;
    let unpaidCount = 0;
    (c.sessions||[]).forEach(s=>{
      if(!isSessionDue(s)) return;
      if(!s.paymentDone) unpaidCount++;
    });
    if(unpaidCount === 0) return;
    const rate = (c.profile && c.profile.ifhp) ? 205 : (c.profile && c.profile.rate != null ? Number(c.profile.rate) : 0);
    rows.push({ id: c.id, name: c.name, unpaidCount, total: unpaidCount * rate });
  });
  rows.sort((a,b)=> b.total - a.total);
  return rows;
}

function owedListHtml(){
  const rows = computeOwedList();
  if(!rows.length) return `<div class="todo-empty">Bekleyen ödeme yok. 🎉</div>`;
  const grandTotal = rows.reduce((sum,r)=>sum+r.total, 0);
  return `
    <div class="owed-total">Toplam: <strong>CA$${grandTotal.toFixed(0)}</strong></div>
    <div class="owed-list">
      ${rows.map(r => `

    </div>`;
}

async function loadHomeCalendarAgenda(retryCount){
  retryCount = retryCount || 0;
  const box = document.getElementById('homeCalendarList');
  if(!box) return;

  if(homeCalendarCache !== null){
    box.innerHTML = homeCalendarCache;
    wireHomeCalendarButtons(box);
    return;
  }

  const emailMap = getKnownClientEmails();
  if(!Object.keys(emailMap).length){
    homeCalendarCache = `<div class="cal-day-empty">Email'i kayıtlı danışan yok — profilden email ekleyince burada görünür.</div>`;
    box.innerHTML = homeCalendarCache;
    return;
  }

  const events = await fetchUpcomingRangeEvents(30);
  if(!document.getElementById('homeCalendarList')) return; // view changed while loading
  if(events === null){
    if(retryCount < 3){
      // Right after login the Google access token may not be captured yet — retry silently a few times.
      await new Promise(r => setTimeout(r, 1500));
      if(!document.getElementById('homeCalendarList')) return;
      return loadHomeCalendarAgenda(retryCount + 1);
    }
    box.innerHTML = `<div class="cal-day-empty" style="color:var(--muted);">Randevular yüklenemedi (Google bağlantısı gerekebilir).</div>`;
    return; // don't cache a failure, allow retry on next tab/view
  }

  const matched = [];
  events.forEach(ev=>{
    const attendees = ev.attendees || [];
    const hit = attendees.find(a => emailMap[(a.email||'').trim().toLowerCase()]);
    if(hit){
      matched.push({ ev, client: emailMap[hit.email.trim().toLowerCase()] });
    }
  });

  if(!matched.length){
    homeCalendarCache = `<div class="cal-day-empty">Önümüzdeki 30 günde danışan randevusu yok.</div>`;
    box.innerHTML = homeCalendarCache;
    return;
  }

  const byDate = {};
  matched.forEach(({ev,client})=>{
    const dt = ev.start && (ev.start.dateTime || ev.start.date);
    if(!dt) return;
    const dateStr = dt.slice(0,10);
    if(!byDate[dateStr]) byDate[dateStr] = [];
    byDate[dateStr].push({ ev, client });
  });

  homeCalendarCache = Object.keys(byDate).sort().map(dateStr=>{
    const rows = byDate[dateStr].map(({ev,client})=>{
      const timeLabel = ev.start.dateTime ? formatEventTime(ev.start.dateTime) : 'Tüm gün';
      return `<div class="cal-day-event-row" data-event-id="${ev.id}" data-event-date="${dateStr}" data-client-id="${client.id}" data-calendar-id="${escapeAttr(ev._calendarId||'primary')}">
        <span class="cal-day-event-time">${timeLabel}</span>
        <span class="cal-day-event-title cal-client-link" data-client-id="${client.id}">${escapeHtml(client.name)}</span>
        <button class="cal-event-edit-btn" type="button" title="Yeniden planla">✏️</button>
        <button class="cal-event-cancel-btn" type="button" title="İptal et">✕</button>
      </div>`;
    }).join('');
    return `<div class="agenda-day-group"><div class="agenda-day-header">${turkishDayName(dateStr)}, ${formatShortDate(dateStr)}</div>${rows}</div>`;
  }).join('');
  box.innerHTML = homeCalendarCache;
  wireHomeCalendarButtons(box);
}

            loadHomeCalendarAgenda();
          }else{

          }
        }
      });

  document.querySelectorAll('.owed-client-name.cal-client-link').forEach(link=>{
    link.addEventListener('click', ()=>{
      const clientId = link.getAttribute('data-client-id');
      activeClientId = clientId;
      mainView = 'client';
      document.body.classList.add('mobile-detail');
      render();
    });
  });

  document.querySelectorAll('.birthday-item.cal-client-link').forEach(link=>{
    link.addEventListener('click', ()=>{
      const clientId = link.getAttribute('data-client-id');
      activeClientId = clientId;
      mainView = 'client';
      document.body.classList.add('mobile-detail');
      render();
    });
  });

  document.querySelectorAll('.home-tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      homeMobileTab = btn.getAttribute('data-tab');
      renderHome();
    });
  });

  document.getElementById('backToListBtn').addEventListener('click', ()=>{
    document.body.classList.remove('mobile-detail');
  });

  const homeDoneToggle = document.getElementById('homeDoneToggle');
  if(homeDoneToggle){
    homeDoneToggle.addEventListener('click', ()=>{
      homeDoneCollapsed = !homeDoneCollapsed;
      renderHome();
    });
  }

  document.getElementById('homeSortSelect').addEventListener('change', (ev)=>{
    homeSortMode = ev.target.value;
    renderHome();
  });

  wireHomeClientPicker();

  document.querySelector('.home-todo-add-btn').addEventListener('click', ()=>{
    const textInput = document.querySelector('.home-todo-text');
    const text = textInput.value.trim();
    if(!text) return;
    const importance = Number(document.querySelector('.home-todo-importance').value);
    const dueDate = document.querySelector('.home-todo-duedate').value;
    const clientId = document.querySelector('.home-todo-client-id').value;
    const newTodo = { id: uid(), text, importance, dueDate, done:false, doneAt:null };
    if(clientId){
      const client = state.clients.find(c=>c.id===clientId);
      client.todos = client.todos || [];
      client.todos.push(newTodo);
    }else{
      state.generalTodos.push(newTodo);
    }
    saveState();
    renderHome();
  });

  document.querySelectorAll('.home-task-row').forEach(row=>{
    const clientId = row.getAttribute('data-client-id');
    const todoId = row.getAttribute('data-todo-id');
    row.querySelector('.home-task-check').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.done = ev.target.checked;
      todo.doneAt = todo.done ? todayIso() : null;
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-text-input').addEventListener('blur', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      const val = ev.target.value.trim();
      if(val){ todo.text = val; saveState(); }
      else{ ev.target.value = todo.text; }
    });
    const taskTextEl = row.querySelector('.home-task-text-input');
    const autoResize = ()=>{ taskTextEl.style.height = 'auto'; taskTextEl.style.height = taskTextEl.scrollHeight + 'px'; };
    taskTextEl.addEventListener('input', autoResize);
    autoResize();
    row.querySelector('.home-task-importance-select').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.importance = Number(ev.target.value);
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-duedate-input').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.dueDate = ev.target.value;
      saveState();
      renderHome();
    });
    {
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      wireTaskExtras(row, todo, saveState, renderHome);
    }
    row.querySelector('.home-task-del').addEventListener('click', ()=>{
      if(!confirm('Bu iş silinsin mi?')) return;
      if(clientId){
        const client = state.clients.find(c=>c.id===clientId);
        client.todos = client.todos.filter(t=>t.id!==todoId);
      }else{
        state.generalTodos = state.generalTodos.filter(t=>t.id!==todoId);
      }
      saveState();
      renderHome();
    });
    const clientBadge = row.querySelector('.home-task-client');
    if(clientBadge){
      clientBadge.addEventListener('click', ()=>{
        activeClientId = clientId;
        mainView = 'client';
        document.body.classList.add('mobile-detail');
        render();
      });
    }
  });
}

function wireHomeClientPicker(){
  const wrap = document.querySelector('.client-picker');
  const searchInput = wrap.querySelector('.home-todo-client-search');
  const hiddenId = wrap.querySelector('.home-todo-client-id');
  const listEl = wrap.querySelector('.client-picker-list');

  function renderOptions(query){
    const q = normalizeForSearch(query.trim());
    const matches = q ? state.clients.filter(c=>normalizeForSearch(c.name).includes(q)) : state.clients;
    listEl.innerHTML = matches.length
      ? matches.map(c=>`<div class="client-picker-item" data-id="${c.id}">${escapeHtml(c.name)}</div>`).join('')
      : `<div class="client-picker-empty">Eşleşme yok</div>`;
    listEl.querySelectorAll('.client-picker-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        hiddenId.value = item.getAttribute('data-id');
        searchInput.value = item.textContent;
        listEl.classList.remove('open');
      });
    });
  }

  searchInput.addEventListener('focus', ()=>{
    renderOptions(searchInput.value);
    listEl.classList.add('open');
  });
  searchInput.addEventListener('input', ()=>{
    hiddenId.value = '';
    renderOptions(searchInput.value);
    listEl.classList.add('open');
  });
  document.addEventListener('click', (ev)=>{
    if(!ev.target.closest('.client-picker')) listEl.classList.remove('open');
  });
}

function homeTaskRowHtml(clientId, clientName, todo){
  const overdue = !todo.done && todo.dueDate && todo.dueDate < todayIso();
  return `
  <div class="home-task-row ${todo.done?'done':''}" data-client-id="${clientId||''}" data-todo-id="${todo.id}">
    <input type="checkbox" class="home-task-check" ${todo.done?'checked':''}>
    <div class="home-task-main">
      <textarea class="home-task-text-input" rows="1">${escapeHtml(todo.text)}</textarea>
      <div class="home-task-meta">
        ${clientName ? `<span class="home-task-client">${escapeHtml(clientName)}</span>` : `<span class="home-task-general">Genel</span>`}
        <select class="home-task-importance-select">
          <option value="1" ${todo.importance===1?'selected':''}>⭐ Düşük</option>
          <option value="2" ${todo.importance===2?'selected':''}>⭐⭐ Orta</option>
          <option value="3" ${todo.importance===3?'selected':''}>⭐⭐⭐ Yüksek</option>
        </select>
        <input type="date" class="home-task-duedate-input ${overdue?'overdue':''}" value="${todo.dueDate||''}">
        ${taskExtrasToggleHtml(todo)}
      </div>
      ${taskExtrasBodyHtml(todo)}
    </div>
    <button class="home-task-del" title="Sil">✕</button>
  </div>`;
}

init();
</script>
</body>
</html>
