<style>
  :root{
    --ink:#2b2d33;
    --muted:#6b6f78;
    --card:#ffffff;
    --card-line:#e2e2ea;
    --paper:#fbfafc;
    --highlight:#d9e3f0;
    --highlight-line:#c3d3e6;
    --grad-start:#dfe7f4;
    --grad-end:#f6e3ea;
    --red:#c15a6b;
    --red-bg:#f8e2e6;
    --green:#4f8f7c;
    --green-bg:#e2f0ea;
    --neutral:#b7bcc2;
    --neutral-bg:#eef0f2;
    --pink:#f0c7d4;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--paper);
  }
  body{
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    background:var(--paper);
  }
  h1,h2,h3,.brand{font-family:'Fraunces', serif;}

  .file-setup{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--grad-start) 0%, var(--grad-end) 100%);
    z-index:50;
    padding:20px;
  }
  .setup-box{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:32px 36px;
    max-width:420px;
    text-align:center;
  }
  .setup-box h2{margin:0 0 10px; font-size:21px;}
  .setup-box p{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.55;}
  .setup-box .filename{font-weight:600; color:var(--ink);}
  .setup-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .setup-actions button{
    padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:13.5px;
    background:var(--highlight); color:var(--ink);
  }
  .setup-actions button.secondary{
    background:none; border:1px solid var(--card-line); color:var(--muted);
  }
  .setup-actions button:hover{filter:brightness(0.97);}

  #appShell{
    display:none;
    position:fixed;
    inset:0;
  }
  #appShell.visible{display:flex;}

  #sidebar{
    width:280px;
    flex-shrink:0;
    background:linear-gradient(165deg, var(--grad-start) 0%, var(--grad-end) 100%);
    color:var(--ink);
    border-right:1px solid var(--card-line);
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink);
  }
  .brand-logo{
    display:block;
    width:auto;
    max-width:100px;
    height:auto;
    flex-shrink:0;
  }
  .brand small{
    display:block;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:9.5px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:0.8px;
    text-transform:uppercase;
    line-height:1.4;
  }
  #addClientForm{
    display:flex;
    gap:6px;
  }
  .sidebar-list-toggle{display:flex; gap:6px; margin-bottom:10px;}
  .sidebar-list-toggle-btn{
    flex:1;
    background:none;
    border:1px solid var(--card-line);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;
    font-weight:600;
    padding:6px 4px;
    border-radius:7px;
    cursor:pointer;
  }
  .sidebar-list-toggle-btn.active{background:var(--highlight); border-color:var(--highlight-line); color:var(--ink);}
  #addProspectForm{display:flex; gap:6px; margin-bottom:10px;}
  #newProspectName{
    flex:1;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid var(--card-line);
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
  }
  .prospect-row{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:9px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .prospect-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer;}
  .prospect-name{font-size:13.5px; font-weight:600; color:var(--ink);}
  .prospect-row-actions{display:flex; gap:4px; flex-shrink:0;}
  .prospect-row-actions button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 4px;}
  .prospect-row-actions button:hover{color:var(--ink);}
  .prospect-details{margin-top:10px; padding-top:10px; border-top:1px dashed var(--card-line); display:flex; flex-direction:column; gap:8px;}
  .prospect-details.collapsed{display:none;}
  .prospect-details input, .prospect-details textarea{
    width:100%;
    font-family:inherit;
    font-size:12.5px;
    padding:6px 8px;
    border:1px solid var(--card-line);
    border-radius:6px;
    background:#fdfcfd;
    color:var(--ink);
  }
  .prospect-details textarea{min-height:50px; resize:vertical;}
  .prospect-contact-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .prospect-convert-btn{
    background:var(--green);
    border:1px solid var(--green);
    color:#fff;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .search-input-wrap{
    position:relative;
    flex:1;
    display:flex;
  }
  #newClientName{
    flex:1;
    padding:8px 28px 8px 10px;
    border-radius:6px;
    border:1px solid var(--card-line);
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
  }
  #newClientName::placeholder{color:var(--muted);}
  #clearClientSearchBtn{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    padding:4px 6px;
    display:none;
    line-height:1;
  }
  #clearClientSearchBtn:hover{color:var(--ink);}
  #clearClientSearchBtn.visible{display:block;}
  .search-empty{
    color:var(--muted);
    font-size:12.5px;
    font-style:italic;
    padding:10px 4px;
    line-height:1.5;
  }
  .sidebar-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    opacity:0.75;
    flex:1;
    padding:30px 16px;
    gap:12px;
  }
  .sidebar-empty svg{width:52px; height:52px; flex-shrink:0;}
  .sidebar-empty span{font-size:12.5px; line-height:1.5;}
  #addClientForm button{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-weight:600;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    font-size:13px;
  }
  #addClientForm button:hover{filter:brightness(0.97);}
  .sort-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  .sort-row select{
    flex:1;
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    border:1px solid var(--card-line);
    border-radius:6px;
    padding:5px 6px;
    font-family:inherit;
    font-size:12.5px;
  }
  #clientList{
    list-style:none;
    margin:0;
    padding:0;
    overflow-y:auto;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .client-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .client-row:hover{background:rgba(255,255,255,0.55);}
  .client-row.active{background:var(--highlight); border-color:var(--highlight-line);}
  .seal{
    width:12px;height:12px;border-radius:50%;
    flex-shrink:0;
    box-shadow:0 0 0 3px rgba(43,45,51,0.05);
  }
  .seal.red{background:var(--red);}
  .seal.green{background:var(--green);}
  .seal.neutral{background:var(--neutral);}
  .seal.terminated{background:#4a4a52; box-shadow:0 0 0 3px rgba(74,74,82,0.18);}
  .client-name{
    flex:1;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .todo-badge{
    flex-shrink:0;
    min-width:16px;
    height:16px;
    padding:0 4px;
    border-radius:8px;
    background:var(--accent, #c98a4b);
    background:#e8a94b;
    color:#3a2a0a;
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .todo-badge.overdue{
    background:var(--red);
    color:#fff;
  }
  .client-del{
    opacity:0;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
  .client-edit{
    opacity:0;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
  .client-row:hover .client-del,
  .client-row:hover .client-edit{opacity:0.7;}
  .client-del:hover{opacity:1 !important; color:var(--red);}
  .client-edit:hover{opacity:1 !important; color:var(--ink);}
  .client-name-input{
    flex:1;
    font-family:inherit;
    font-size:14px;
    padding:4px 6px;
    border-radius:5px;
    border:1px solid var(--highlight-line);
    background:#ffffff;
    color:var(--ink);
  }
  #sidebarFooter{
    margin-top:auto;
    padding-top:12px;
    border-top:1px solid var(--card-line);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  #fileStatus{
    font-size:11px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #fileStatus .dot{
    display:inline-block; width:7px;height:7px;border-radius:50%;
    background:var(--green); margin-right:6px;
  }
  #manualSaveBtn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-family:inherit;
  }
  #manualSaveBtn:hover{filter:brightness(0.97);}

  #settingsNavBtn{
    background:none;

    padding:20px 22px;
    width:100%;
    max-width:300px;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
  }
  .reschedule-popover h3{
    margin:0 0 14px;
    font-size:16px;
    font-family:'Fraunces', serif;
    color:var(--ink);
  }
  .mini-cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .mini-cal-title{
    font-weight:600; font-size:13.5px; color:var(--ink);
  }
  .mini-cal-nav{
    background:var(--neutral-bg);
    border:1px solid var(--card-line);
    color:var(--ink);
    width:26px; height:26px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .mini-cal-nav:hover{background:var(--highlight);}
  .mini-cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    margin-bottom:2px;
  }
  .mini-cal-weekdays span{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding:4px 0;
  }
  .mini-cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:2px;
  }
  .mini-cal-cell{
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    border:none;
    background:none;
    border-radius:7px;
    font-family:inherit;
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .mini-cal-cell.empty{cursor:default;}
  .mini-cal-cell:not(.empty):hover{background:var(--neutral-bg);}
  .mini-cal-cell.today{font-weight:700; color:var(--red);}
  .mini-cal-cell.selected{background:var(--highlight); border:1px solid var(--highlight-line); font-weight:600;}
  .reschedule-time-select{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--card-line);
    font-family:inherit;
    font-size:13.5px;
    color:var(--ink);
    background:var(--card);
  }
  .reschedule-popover .form-actions{
    display:flex; justify-content:flex-end; gap:8px;
    margin-top:16px;
  }
  .reschedule-confirm-btn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    padding:8px 16px;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .reschedule-confirm-btn:hover{filter:brightness(0.97);}
  .reschedule-cancel-btn{
    background:none;
    border:1px solid var(--card-line);
    color:var(--muted);
    padding:8px 16px;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .reschedule-cancel-btn:hover{background:var(--neutral-bg);}
  .cal-datetime-btn{
    width:100%;
    text-align:left;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--card-line);
    font-family:inherit;
    font-size:13.5px;
    color:var(--ink);
    background:var(--card);
    cursor:pointer;
  }
  .cal-datetime-btn:hover{background:var(--neutral-bg);}

  /* Isolated to installed Home Screen apps only — never affects the normal Safari tab,
     where the layout already renders correctly edge to edge. */

<script>
/* ---------- IndexedDB: remember the picked file handle + rolling backups ---------- */
const IDB_NAME = 'danisan-takip-db';
const IDB_STORE = 'handles';
const IDB_BACKUP_STORE = 'backups';
const MAX_BACKUPS = 30;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){ db.createObjectStore(IDB_STORE); }
      if(!db.objectStoreNames.contains(IDB_BACKUP_STORE)){
        db.createObjectStore(IDB_BACKUP_STORE, { keyPath:'timestamp' });
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

async function saveBackupSnapshot(stateObj){
  try{
    const db = await idbOpen();
    const snapshot = { timestamp: Date.now(), data: JSON.stringify(stateObj) };
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_BACKUP_STORE,'readwrite');
      tx.objectStore(IDB_BACKUP_STORE).put(snapshot);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
    await pruneBackups(db);
  }catch(e){ console.error('Yedek kaydedilemedi', e); }
}

async function pruneBackups(db){
  return new Promise((resolve)=>{
    const tx = db.transaction(IDB_BACKUP_STORE,'readwrite');
    const store = tx.objectStore(IDB_BACKUP_STORE);
    const req = store.getAllKeys();
    req.onsuccess = ()=>{
      const keys = req.result.sort((a,b)=>a-b);
      const excess = keys.length - MAX_BACKUPS;
      if(excess > 0){
        for(let i=0;i<excess;i++){ store.delete(keys[i]); }
      }
      resolve();
    };
  });
}

async function listBackups(){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_BACKUP_STORE,'readonly');
    const req = tx.objectStore(IDB_BACKUP_STORE).getAll();
    req.onsuccess = ()=>resolve((req.result||[]).sort((a,b)=>b.timestamp-a.timestamp));
    req.onerror = ()=>reject(req.error);
  });
}

function init(){
  window.addEventListener('fb-ready', startAuthListener);
  if(window.FB) startAuthListener();

const GIS_CLIENT_ID = '171012588947-kglaeca49vu35660rcd2lm66mhtnt3t3.apps.googleusercontent.com';
const GOOGLE_API_SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.compose https://www.googleapis.com/auth/contacts https://www.googleapis.com/auth/drive.file';
let gisTokenClient = null;

function initGisTokenClient(){
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
    setTimeout(initGisTokenClient, 300);
    return;
  }
  gisTokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: GIS_CLIENT_ID,
    scope: GOOGLE_API_SCOPES,
    callback: ()=>{} // overridden per-call in trySilentGisRefresh
  });
}
initGisTokenClient();

function storeGoogleAccessToken(token){
  googleAccessToken = token;
  googleAccessTokenObtainedAt = Date.now();
  try{
    sessionStorage.setItem('googleAccessToken', googleAccessToken);
    sessionStorage.setItem('googleAccessTokenObtainedAt', String(googleAccessTokenObtainedAt));
  }catch(e){ /* sessionStorage unavailable, ignore */ }
}

function captureAccessTokenFromResult(result){
  try{
    const cred = window.FB.credentialFromResult(result);
    if(cred && cred.accessToken){
      storeGoogleAccessToken(cred.accessToken);
    }
  }catch(e){ console.error('Token yakalama hatası', e); }
}

function trySilentGisRefresh(){
  return new Promise((resolve)=>{
    if(!gisTokenClient){ resolve(null); return; }
    const timeout = setTimeout(()=>resolve(null), 4000);
    gisTokenClient.callback = (tokenResponse)=>{
      clearTimeout(timeout);
      if(tokenResponse && tokenResponse.access_token){
        storeGoogleAccessToken(tokenResponse.access_token);
        resolve(googleAccessToken);
      }else{
        resolve(null);
      }
    };
    try{
      const hint = currentUser && currentUser.email ? currentUser.email : undefined;
      gisTokenClient.requestAccessToken({ prompt: '', login_hint: hint });
    }catch(e){ resolve(null); }
  });
}

let showingDenied = false;
let googleAccessToken = null;
let googleAccessTokenObtainedAt = 0;

// Restore a still-fresh token from this tab's session storage, if any (survives page reloads).
try{
  const storedToken = sessionStorage.getItem('googleAccessToken');
  const storedAt = Number(sessionStorage.getItem('googleAccessTokenObtainedAt') || 0);
  if(storedToken && storedAt && (Date.now() - storedAt < 50*60*1000)){
    googleAccessToken = storedToken;
    googleAccessTokenObtainedAt = storedAt;
  }
}catch(e){ /* sessionStorage unavailable, ignore */ }

async function ensureGoogleAccessToken(){
  if(googleAccessToken && (Date.now() - googleAccessTokenObtainedAt < 50*60*1000)){
    return googleAccessToken;
  }
  const silent = await trySilentGisRefresh();
  if(silent) return silent;
  const interactive = await tryInteractiveGisRequest();
  if(interactive) return interactive;
  alert('Google izinleri alınamadı.');
  return null;
}

async function getTokenSilentOnly(){
  if(googleAccessToken && (Date.now() - googleAccessTokenObtainedAt < 50*60*1000)){
    return googleAccessToken;
  }
  return await trySilentGisRefresh();
}

function tryInteractiveGisRequest(){
  return new Promise((resolve)=>{
    if(!gisTokenClient){ resolve(null); return; }
    gisTokenClient.callback = (tokenResponse)=>{
      if(tokenResponse && tokenResponse.access_token){
        storeGoogleAccessToken(tokenResponse.access_token);
        resolve(googleAccessToken);
      }else{
        resolve(null);
      }
    };
    try{
      const hint = currentUser && currentUser.email ? currentUser.email : undefined;
      gisTokenClient.requestAccessToken({ login_hint: hint });
    }catch(e){ resolve(null); }
  });
}

// Each real person may sign in with either of their email addresses;
// both map to the same canonical data bucket so their data stays unified.
const PERSON_EMAILS = {
  kubilay: ['psk.kubilay@gmail.com', 'malik@ikitherapy.ca'],
  duygu: ['duygu.rp@gmail.com', 'duygu@ikitherapy.ca']
};

function canonicalPersonId(email){
  if(!email) return null;
  const lower = email.trim().toLowerCase();
  for(const personId in PERSON_EMAILS){
    if(PERSON_EMAILS[personId].some(e => e.toLowerCase() === lower)) return personId;
  }
  return null;
}

function otherPersonEmail(){
  if(!currentUser || !currentUser.email) return null;
  const personId = canonicalPersonId(currentUser.email);
  if(!personId) return null;
  const emails = PERSON_EMAILS[personId] || [];
  const other = emails.find(e => e.toLowerCase() !== currentUser.email.toLowerCase());
  return other || null;
}

const ALLOWED_EMAILS = [
  'duygu.rp@gmail.com',
  'duygu@ikitherapy.ca',
  'psk.kubilay@gmail.com',
  'malik@ikitherapy.ca'
];

function startAuthListener(){
  window.FB.getRedirectResult(window.FB.auth).then((result)=>{
    if(result) captureAccessTokenFromResult(result);
  }).catch((e)=>{
    console.error('Redirect giriş hatası', e);
  });
  window.FB.onAuthStateChanged(window.FB.auth, async (user)=>{
    if(user){
      if(!ALLOWED_EMAILS.includes(user.email)){
        showingDenied = true;
        setupBoxContent.innerHTML = `<h2>Erişim izni yok</h2><p>${escapeHtml(user.email||'')} için erişim izni tanımlı değil. İzin verilen hesaplardan biriyle giriş yapmayı dene.</p>
          <div class="setup-actions"><button id="tryAgainBtn" class="secondary">Başka Hesapla Dene</button></div>`;
        await window.FB.signOut(window.FB.auth);
        const tryBtn = document.getElementById('tryAgainBtn');
        if(tryBtn) tryBtn.addEventListener('click', ()=>{ showingDenied=false; showSignInScreen(); });
        return;
      }
      showingDenied = false;
      currentUser = user;
      hasLoadedOnce = false;
      subscribeToData();
    }else{
      currentUser = null;
      if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
      document.getElementById('appShell').classList.remove('visible');
      document.getElementById('fileSetup').style.display = 'flex';
      if(!showingDenied){ showSignInScreen(); }
    }
  });
}

function showSignInScreen(){
  setupBoxContent.innerHTML = `
    <h2>Giriş yap</h2>
    <p>Danışan verilerine erişmek için Google hesabınla giriş yapman gerekiyor.</p>
    <div class="setup-actions">
      <button id="googleSignInBtn">Google ile Giriş Yap</button>
    </div>`;
  document.getElementById('googleSignInBtn').addEventListener('click', async ()=>{
    try{
      const result = await window.FB.signInWithPopup(window.FB.auth, window.FB.provider);
      captureAccessTokenFromResult(result);
    }catch(e){
      console.error('Popup giriş hatası, redirect deneniyor', e);
      try{
        await window.FB.signInWithRedirect(window.FB.auth, window.FB.provider);
      }catch(e2){
        alert('Giriş başarısız: ' + e2.message);
      }
    }
  });
}

function subscribeToData(){
  const personId = canonicalPersonId(currentUser.email);
  const ref = window.FB.doc(window.FB.db, 'users', personId, 'appdata', 'main');
  unsubscribeSnapshot = window.FB.onSnapshot(ref, async (snap)=>{
    if(snap.exists()){
      state = snap.data();
    }else{
      // No data yet under the new merged (per-person) path — check for legacy data
      // under this specific account's old per-UID path and migrate it automatically.
      let migrated = false;
      try{
        const legacyRef = window.FB.doc(window.FB.db, 'users', currentUser.uid, 'appdata', 'main');
        const legacySnap = await window.FB.getDoc(legacyRef);
        if(legacySnap.exists()){
          state = legacySnap.data();
          migrated = true;
        }
      }catch(e){ console.error('Eski veri kontrolü başarısız', e); }
      if(!migrated){ state = exampleData(); }
      if(!state.clients) state.clients = [];
      if(!state.generalTodos) state.generalTodos = [];
      if(!state.prospects) state.prospects = [];
      if(migrated){
        try{ await window.FB.setDoc(ref, JSON.parse(JSON.stringify(state))); }catch(e){ console.error('Taşıma kaydı başarısız', e); }
      }
    }
    if(!state.clients) state.clients = [];
    if(!state.generalTodos) state.generalTodos = [];
      if(!state.prospects) state.prospects = [];

    if(!hasLoadedOnce){
      hasLoadedOnce = true;
      finishSetup();
    }else{
      render();
    }
  }, (err)=>{
    console.error('Senkron hatası', err);
    setupBoxContent.innerHTML = `<h2>Bağlantı hatası</h2><p>${escapeHtml(err.message)}</p>`;
    document.getElementById('appShell').classList.remove('visible');
    document.getElementById('fileSetup').style.display = 'flex';
  });
}

function finishSetup(){
  if(canonicalPersonId(currentUser.email) === 'duygu' && !state.surpriseSeen){
    document.getElementById('fileSetup').style.display = 'none';
    showDaisySurprise();
    return;
  }
  proceedToApp();
}

function proceedToApp(){
  document.getElementById('fileSetup').style.display = 'none';
  document.getElementById('appShell').classList.add('visible');
  document.getElementById('fileStatus').innerHTML = `<span class="dot"></span>${escapeHtml(currentUser.email || currentUser.displayName || 'Google hesabı')}`;
  mainView = 'home';
  lastBackupTime = Date.now();
  saveBackupSnapshot(state);
  resetInactivityTimer();
  render();
}

function showDaisySurprise(){
  const overlay = document.createElement('div');
  overlay.id = 'surpriseOverlay';
  overlay.className = 'surprise-overlay';
  const petalCount = 8;
  let petalsHtml = '';
  for(let i=0;i<petalCount;i++){
    const angle = (360/petalCount)*i;
    petalsHtml += `<div class="daisy-petal" style="--angle:${angle}deg" data-index="${i}"></div>`;
  }
  overlay.innerHTML = `
    <div class="surprise-box">
      <p class="surprise-intro" id="surpriseIntro">Her yaprağa dokun 🌼</p>
      <div class="daisy" id="daisyFlower">
        ${petalsHtml}
        <div class="daisy-center"></div>
      </div>
      <div class="surprise-message" id="surpriseMessage"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  let remaining = petalCount;
  overlay.querySelectorAll('.daisy-petal').forEach(petal=>{
    petal.addEventListener('click', ()=>{
      if(petal.classList.contains('gone')) return;
      petal.classList.add('gone');
      remaining--;

        const intro = document.getElementById('surpriseIntro');
        if(intro) intro.style.opacity = '0';
        setTimeout(()=>{

          msg.innerHTML = `

            <div class="surprise-text">Kubilay seni çok seviyor</div>

          `;
          msg.classList.add('show');
          document.getElementById('surpriseContinueBtn').addEventListener('click', finishSurprise);
        }, 500);
      }

function finishSurprise(){
  state.surpriseSeen = true;
  saveState();
  const overlay = document.getElementById('surpriseOverlay');
  if(overlay) overlay.remove();
  proceedToApp();
}

const GOOGLE_DRIVE_BACKUP_FILENAME = 'danisan-takip-yedek.json';
let driveBackupFileId = null;
let lastDriveBackupAt = 0;
const DRIVE_BACKUP_MIN_INTERVAL_MS = 3*60*1000;
let driveBackupStatus = 'idle'; // idle | saving | success | error

async function findOrCreateDriveBackupFileId(token){
  if(driveBackupFileId) return driveBackupFileId;
  try{
    const q = `name='${GOOGLE_DRIVE_BACKUP_FILENAME}' and trashed=false`;
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&spaces=drive&fields=files(id,name)`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if(listRes.ok){
      const data = await listRes.json();
      if(data.files && data.files.length){
        driveBackupFileId = data.files[0].id;
      }
    }
  }catch(e){ console.error('Drive dosyası aranamadı', e); }
  return driveBackupFileId;
}

async function uploadDriveBackup(interactive){
  if(!currentUser) return false;
  const token = interactive ? await ensureGoogleAccessToken() : await getTokenSilentOnly();
  if(!token){
    console.error('Drive yedeği: geçerli bir Google erişim jetonu alınamadı (izin verilmemiş olabilir).');
    return false;
  }
  const jsonText = JSON.stringify(state, null, 2);
  try{
    const existingId = await findOrCreateDriveBackupFileId(token);
    if(existingId){
      const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: jsonText
      });
      if(!res.ok){
        console.error('Drive yedeği güncellenemedi. HTTP', res.status, await res.text());
      }
      return res.ok;
    }else{
      const metadata = { name: GOOGLE_DRIVE_BACKUP_FILENAME, mimeType: 'application/json' };
      const boundary = 'danisantakipboundary';
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${jsonText}\r\n` +
        `--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
        body
      });
      if(res.ok){
        const data = await res.json();
        driveBackupFileId = data.id;
        return true;
      }
      console.error('Drive yedeği oluşturulamadı. HTTP', res.status, await res.text());
      return false;
    }
  }catch(e){
    console.error('Drive yedeği yüklenemedi', e);
    return false;
  }
}

async function maybeDriveBackup(){
  const now = Date.now();
  if(now - lastDriveBackupAt < DRIVE_BACKUP_MIN_INTERVAL_MS) return;
  lastDriveBackupAt = now;
  driveBackupStatus = 'saving';
  const ok = await uploadDriveBackup(false); // silent only — never interrupts with a popup
  driveBackupStatus = ok ? 'success' : 'error';
}

async function saveState(){
  maybeSnapshotBackup();
  maybeDriveBackup();
  if(!currentUser) return;
  try{
    const personId = canonicalPersonId(currentUser.email);
    const ref = window.FB.doc(window.FB.db, 'users', personId, 'appdata', 'main');
    await window.FB.setDoc(ref, JSON.parse(JSON.stringify(state)));
  }catch(e){
    console.error('Kaydetme hatası', e);
  }
}

async function logAudit(action, details){
  if(!currentUser) return;
  try{
    const personId = canonicalPersonId(currentUser.email);
    const ref = window.FB.collection(window.FB.db, 'users', personId, 'auditLog');
    await window.FB.addDoc(ref, {
      action,
      details: details || '',
      at: window.FB.serverTimestamp(),
      by: currentUser.email || ''
    });
  }catch(e){
    console.error('İşlem kaydı yazılamadı', e);
  }
}

async function handleImportJsonFile(ev){
  const file = ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  let imported;
  try{
    const text = await file.text();
    imported = JSON.parse(text);
  }catch(e){
    alert('Dosya okunamadı. Geçerli bir JSON dosyası seçtiğinden emin ol.');
    return;
  }
  const importedClients = Array.isArray(imported.clients) ? imported.clients : [];
  const importedTodos = Array.isArray(imported.generalTodos) ? imported.generalTodos : [];
  if(!importedClients.length && !importedTodos.length){
    alert('Bu dosyada içe aktarılacak danışan bulunamadı.');
    return;
  }
  if(!confirm(`${importedClients.length} danışan bu hesaba eklenecek. Mevcut verilerin üzerine yazılmaz, üstüne eklenir. Devam edilsin mi?`)) return;

  importedClients.forEach(c=>{
    if(!c.id) c.id = uid();
    if(!c.todos) c.todos = [];
    if(c.generalAdminNote == null) c.generalAdminNote = '';
    if(!c.profile) c.profile = { info:'', address:'', phone:'', email:'', ifhp:false, rate:null, terminated:false };
    (c.sessions||[]).forEach(s=>{ if(!s.id) s.id = uid(); });
  });
  importedTodos.forEach(t=>{ if(!t.id) t.id = uid(); });

  state.clients = [...state.clients, ...importedClients];
  state.generalTodos = [...(state.generalTodos||[]), ...importedTodos];
  if(!activeClientId && state.clients.length){ activeClientId = state.clients[0].id; }
  saveState();
  logAudit('JSON içe aktarıldı', `${importedClients.length} danışan eklendi`);
  render();
  alert(`${importedClients.length} danışan başarıyla içe aktarıldı.`);
}

function formatBackupTime(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  let hour = d.getHours();
  const minute = pad(d.getMinutes());
  const meridiem = hour >= 12 ? 'PM' : 'AM';
  hour = hour % 12;
  if(hour === 0) hour = 12;
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${hour}:${minute} ${meridiem}`;
}

async function openBackupsModal(){
  const modal = document.getElementById('backupsModal');
  const list = document.getElementById('backupsList');
  modal.classList.add('open');
  list.innerHTML = `<div class="backups-empty">Yükleniyor…</div>`;
  let backups = [];
  try{ backups = await listBackups(); }catch(e){}

  if(!backups.length){
    list.innerHTML = `<div class="backups-empty">Henüz yedek yok.</div>`;
    return;
  }

  list.innerHTML = backups.map(b=>{
    let clientCount = '?';
    try{ clientCount = (JSON.parse(b.data).clients || []).length; }catch(e){}
    return `
    <div class="backup-row" data-ts="${b.timestamp}">
      <div class="backup-row-info">
        ${formatBackupTime(b.timestamp)}
        <small>${clientCount} danışan</small>
      </div>
      <button class="backup-restore-btn" type="button">Geri Yükle</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.backup-row').forEach(row=>{
    const ts = Number(row.getAttribute('data-ts'));
    row.querySelector('.backup-restore-btn').addEventListener('click', async ()=>{
      if(!confirm(`${formatBackupTime(ts)} tarihli yedeğe dönülsün mü? Şu anki veriler bu yedeğin üzerine yazılacak.`)) return;
      const backups2 = await listBackups();
      const match = backups2.find(b=>b.timestamp===ts);
      if(!match){ alert('Yedek bulunamadı.'); return; }
      try{
        state = JSON.parse(match.data);
      }catch(e){
        alert('Yedek okunamadı.');
        return;
      }
      saveState();
      closeBackupsModal();
      render();
    });
  });
}

async function silentSignOut(){
  googleAccessToken = null;
  googleAccessTokenObtainedAt = 0;
  try{ sessionStorage.removeItem('googleAccessToken'); sessionStorage.removeItem('googleAccessTokenObtainedAt'); }catch(e){}
  try{ sessionStorage.removeItem('viewState'); }catch(e){}

}

/* ---------- Auto sign-out after inactivity ---------- */
const INACTIVITY_LIMIT_MS = 30 * 60 * 1000; // 30 minutes
let inactivityTimer = null;

function resetInactivityTimer(){
  if(!currentUser) return;
  if(inactivityTimer) clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(async ()=>{
    if(currentUser){
      await silentSignOut();
    }
  }, INACTIVITY_LIMIT_MS);
}

['click','keydown','mousemove','touchstart','scroll'].forEach(evt=>{
  document.addEventListener(evt, resetInactivityTimer, { passive:true });
});

/* ---------- Data model ---------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function exampleData(){
  return {
    clients: [],
    generalTodos: [],
    prospects: []
  };
}

function isSessionDue(session){
  if(session.calendarEndTime){
    return Date.now() >= new Date(session.calendarEndTime).getTime();
  }
  if(!session.date) return true;
  return session.date <= todayIso();
}

function clientStatus(client){
  if(!client.sessions.length) return 'neutral';
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  const pastSessions = client.sessions.filter(s => isSessionDue(s));
  if(!pastSessions.length) return 'neutral';
  for(const s of pastSessions){
    const invoiceOk = noInvoice ? true : s.invoiceDone;
    if(!(s.paymentDone && invoiceOk && s.notesDone && s.nextDone)){
      return 'red';
    }
  }
  return 'green';
}

function renderProspectList(){
  const list = document.getElementById('prospectList');
  list.innerHTML = '';
  if(!state.prospects) state.prospects = [];
  const prospects = state.prospects.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  if(!prospects.length){
    const li = document.createElement('li');
    li.className = 'search-empty';
    li.innerHTML = `<span>Henüz danışan adayı yok.<br>Yukarıdan bir isim ekleyerek başla.</span>`;
    list.appendChild(li);
    return;
  }

  prospects.forEach(p=>{
    const li = document.createElement('li');
    const open = expandedProspectId === p.id;
    li.innerHTML = `
      <div class="prospect-row" data-id="${p.id}">
        <div class="prospect-row-top">
          <span class="prospect-name">${escapeHtml(p.name)}</span>
          <div class="prospect-row-actions">
            <button class="prospect-del" title="Sil">✕</button>
          </div>
        </div>
        <div class="prospect-details ${open ? '' : 'collapsed'}">
          <input type="text" class="prospect-phone" placeholder="Telefon" value="${escapeAttr(p.phone||'')}">
          <input type="text" class="prospect-email" placeholder="Email" value="${escapeAttr(p.email||'')}">
          <div class="prospect-contact-actions">
            <a class="contact-btn ${p.phone?'':'disabled'}" href="${telLink(p.phone)}">📞 Ara</a>
            <a class="contact-btn ${p.phone?'':'disabled'}" href="${whatsappLink(p.phone)}" target="_blank" rel="noopener">💬 WhatsApp</a>
            <a class="contact-btn ${p.email?'':'disabled'}" href="${mailtoLink(p.email)}" rel="noopener">✉️ Email</a>
          </div>
          <textarea class="prospect-notes" placeholder="Notlar…">${escapeHtml(p.notes||'')}</textarea>
          <button class="prospect-convert-btn" type="button">→ Danışan Yap</button>
        </div>
      </div>`;
    list.appendChild(li);

    li.querySelector('.prospect-row-top').addEventListener('click', (ev)=>{
      if(ev.target.closest('.prospect-del')) return;
      expandedProspectId = (expandedProspectId === p.id) ? null : p.id;
      renderProspectList();
    });
    li.querySelector('.prospect-del').addEventListener('click', ()=>{
      if(!confirm(`"${p.name}" silinsin mi?`)) return;
      state.prospects = state.prospects.filter(x=>x.id!==p.id);
      saveState();
      renderProspectList();
    });
    if(open){
      li.querySelector('.prospect-phone').addEventListener('blur', (ev)=>{
        p.phone = ev.target.value; saveState();
      });
      li.querySelector('.prospect-email').addEventListener('blur', (ev)=>{
        p.email = ev.target.value; saveState();
      });
      li.querySelector('.prospect-notes').addEventListener('blur', (ev)=>{
        p.notes = ev.target.value; saveState();
      });
      li.querySelector('.prospect-convert-btn').addEventListener('click', ()=>{
        convertProspectToClient(p);
      });
    }
  });
}

function convertProspectToClient(prospect){
  if(!confirm(`"${prospect.name}" danışan listesine taşınsın mı?`)) return;
  const newClient = {
    id: uid(),
    name: prospect.name,
    generalAdminNote: prospect.notes || '',
    todos: [],
    sessions: [],
    profile: {
      info: '', address: '',
      phone: prospect.phone || '', email: prospect.email || '',
      ifhp: false, rate: null, noInvoice: false, terminated: false
    }
  };
  state.clients.push(newClient);
  state.prospects = state.prospects.filter(x=>x.id!==prospect.id);
  saveState();
  sidebarListMode = 'clients';
  activeClientId = newClient.id;
  mainView = 'client';
  expandedProspectId = null;
  document.body.classList.add('mobile-detail');
  render();
}

function pendingChecklistCount(client){
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  let count = 0;
  (client.sessions||[]).forEach(s=>{
    if(!isSessionDue(s)) return; // not due yet (session hasn't ended), don't count as pending
    if(!s.paymentDone) count++;
    if(!noInvoice && !s.invoiceDone) count++;
    if(!s.notesDone) count++;
    if(!s.nextDone) count++;
  });
  return count;
}

function pendingTodoCount(client){
  return (client.todos||[]).filter(t=>!t.done).length;
}

function lastSessionDate(client){
  let max = null;
  client.sessions.forEach(s=>{
    if(!isSessionDue(s)) return; // ignore sessions that haven't happened yet
    if(s.date && (!max || s.date > max)) max = s.date;
  });
  return max;
}

function getSortedClients(){
  let arr = [...state.clients];
  if(sortMode === 'name'){
    arr.sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  } else if(sortMode === 'lastSession'){
    arr.sort((a,b)=>{
      const da = lastSessionDate(a);
      const db = lastSessionDate(b);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return db.localeCompare(da);
    });
  } else if(sortMode === 'pendingChecks'){
    arr.sort((a,b)=> pendingChecklistCount(b) - pendingChecklistCount(a));
  } else if(sortMode === 'pendingTodos'){
    arr.sort((a,b)=> pendingTodoCount(b) - pendingTodoCount(a));
  }
  if(searchQuery.trim()){
    const q = normalizeForSearch(searchQuery.trim());
    arr = arr.filter(c=>normalizeForSearch(c.name).includes(q));
  }
  return arr;
}

const TR_MAP = { 'ç':'c','Ç':'C','ğ':'g','Ğ':'G','ı':'i','İ':'I','ö':'o','Ö':'O','ş':'s','Ş':'S','ü':'u','Ü':'U' };

/* ---------- Google Calendar + Gmail (real attachment) integration ---------- */
async function fetchDayEvents(dateStr){
  const token = await ensureGoogleAccessToken();
  if(!token) return null;
  const start = new Date(`${dateStr}T00:00:00`);
  const end = new Date(`${dateStr}T23:59:59`);
  const calendarIds = ['primary'];
  const other = otherPersonEmail();
  if(other) calendarIds.push(other);
  try{
    const results = await Promise.all(calendarIds.map(async (calId)=>{
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?timeMin=${encodeURIComponent(start.toISOString())}&timeMax=${encodeURIComponent(end.toISOString())}&singleEvents=true&orderBy=startTime`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok) return [];
      const data = await res.json();
      return (data.items || []).map(ev => ({ ...ev, _calendarId: calId }));
    }));
    return results.flat().sort((a,b)=>{
      const sa = (a.start && (a.start.dateTime || a.start.date)) || '';
      const sb = (b.start && (b.start.dateTime || b.start.date)) || '';
      return sa.localeCompare(sb);
    });
  }catch(e){
    return null;
  }
}

function formatEventTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  let hour = d.getHours();
  const minute = String(d.getMinutes()).padStart(2,'0');
  const meridiem = hour >= 12 ? 'PM' : 'AM';
  hour = hour % 12;
  if(hour === 0) hour = 12;
  return `${hour}:${minute} ${meridiem}`;
}

function parseAmPmTime(input){
  if(!input) return null;
  const match = input.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)$/);
  if(!match) return null;
  let hour = parseInt(match[1], 10);
  const minute = match[2];
  const meridiem = match[3].toUpperCase();
  if(hour < 1 || hour > 12 || Number(minute) > 59) return null;
  if(meridiem === 'AM'){
    if(hour === 12) hour = 0;
  }else{
    if(hour !== 12) hour += 12;
  }
  return `${String(hour).padStart(2,'0')}:${minute}`;
}

function promptForTime(defaultText){
  let attempt = prompt('Yeni saat (örn: 2:30 PM):', defaultText || '10:00 AM');
  if(!attempt) return null;
  let parsed = parseAmPmTime(attempt);
  while(attempt && !parsed){
    attempt = prompt('Geçersiz format. Örnek: 2:30 PM ya da 10:00 AM şeklinde gir:', attempt);
    if(!attempt) return null;
    parsed = parseAmPmTime(attempt);
  }
  return parsed;
}

function pad2(n){ return String(n).padStart(2,'0'); }

// Builds the <option> list for a 15-minute-interval time dropdown (12h AM/PM labels).
function timeSelectOptionsHtml(selectedLabel){
  const opts = [];
  for(let h = 0; h < 24; h++){
    for(let m = 0; m < 60; m += 15){
      let hour12 = h % 12;
      if(hour12 === 0) hour12 = 12;
      const meridiem = h >= 12 ? 'PM' : 'AM';
      const label = `${hour12}:${pad2(m)} ${meridiem}`;
      opts.push(`<option value="${label}" ${label===selectedLabel?'selected':''}>${label}</option>`);
    }
  }
  return opts.join('');
}

// Rounds an "H:MM AM/PM" label to the nearest 15-minute mark so it lines up with the dropdown.
function nearestQuarterHourLabel(label){
  const parsed = parseAmPmTime(label);
  if(!parsed) return '10:00 AM';
  let [h, m] = parsed.split(':').map(Number);
  m = Math.round(m / 15) * 15;
  if(m === 60){ m = 0; h = (h + 1) % 24; }
  let hour12 = h % 12;
  if(hour12 === 0) hour12 = 12;
  const meridiem = h >= 12 ? 'PM' : 'AM';
  return `${hour12}:${pad2(m)} ${meridiem}`;
}

// Renders a single month grid (Monday-first) for the mini date picker.
function miniCalendarMonthHtml(year, month, selectedIso){
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const dayNames = ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'];
  const firstOfMonth = new Date(year, month, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = todayIso();
  let cells = '';
  for(let i=0; i<startOffset; i++){ cells += `<div class="mini-cal-cell empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${pad2(month+1)}-${pad2(d)}`;
    const cls = ['mini-cal-cell'];
    if(iso === selectedIso) cls.push('selected');
    if(iso === todayStr) cls.push('today');
    cells += `<button type="button" class="${cls.join(' ')}" data-date="${iso}">${d}</button>`;
  }
  return `
    <div class="mini-cal-header">
      <button type="button" class="mini-cal-nav" data-nav="-1" title="Önceki ay">‹</button>
      <span class="mini-cal-title">${monthNames[month]} ${year}</span>
      <button type="button" class="mini-cal-nav" data-nav="1" title="Sonraki ay">›</button>
    </div>
    <div class="mini-cal-weekdays">${dayNames.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="mini-cal-grid">${cells}</div>
  `;
}

// Opens a small popover with a mini month calendar (date) + 15-minute dropdown (time)
// to replace the old prompt()-based reschedule flow.
function openReschedulePopover({ initialDate, initialTimeLabel, onConfirm, title }){
  const overlay = document.createElement('div');
  overlay.className = 'reschedule-overlay';

  let selectedIso = initialDate || todayIso();
  let viewDate = new Date(`${selectedIso}T00:00:00`);
  if(isNaN(viewDate)) viewDate = new Date();
  const initialTime = nearestQuarterHourLabel(initialTimeLabel || '10:00 AM');

  function renderPopover(){
    overlay.innerHTML = `
      <div class="reschedule-popover">
        <h3>${title || 'Randevuyu Yeniden Planla'}</h3>
        <div class="mini-cal">${miniCalendarMonthHtml(viewDate.getFullYear(), viewDate.getMonth(), selectedIso)}</div>
        <div class="field-block" style="margin-top:12px;">
          <label>Saat</label>
          <select class="reschedule-time-select">${timeSelectOptionsHtml(initialTime)}</select>
        </div>
        <div class="form-actions">
          <button type="button" class="reschedule-cancel-btn">Vazgeç</button>
          <button type="button" class="reschedule-confirm-btn">Kaydet</button>
        </div>
      </div>`;
    wirePopover();
  }

  function wirePopover(){
    overlay.querySelectorAll('.mini-cal-nav').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const dir = parseInt(btn.getAttribute('data-nav'), 10);
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+dir, 1);
        renderPopover();
      });
    });
    overlay.querySelectorAll('.mini-cal-cell[data-date]').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        selectedIso = cell.getAttribute('data-date');
        renderPopover();
      });
    });
    overlay.querySelector('.reschedule-cancel-btn').addEventListener('click', ()=>{
      overlay.remove();
    });
    overlay.querySelector('.reschedule-confirm-btn').addEventListener('click', ()=>{
      const timeLabel = overlay.querySelector('.reschedule-time-select').value;
      overlay.remove();
      onConfirm(selectedIso, timeLabel);
    });
  }

  overlay.addEventListener('click', (ev)=>{
    if(ev.target === overlay) overlay.remove();
  });

  renderPopover();
  document.body.appendChild(overlay);
}

async function rescheduleCalendarEvent(eventId, dateStr, timeStr, calendarId){
  const token = await ensureGoogleAccessToken();
  if(!token) return false;
  const calId = calendarId || 'primary';
  try{
    const getRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${eventId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if(!getRes.ok) return false;
    const existing = await getRes.json();
    const oldStart = new Date(existing.start.dateTime || existing.start.date);
    const oldEnd = new Date(existing.end.dateTime || existing.end.date);
    const durationMs = oldEnd - oldStart;
    const newStart = new Date(`${dateStr}T${timeStr}:00`);
    const newEnd = new Date(newStart.getTime() + durationMs);
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${eventId}?sendUpdates=all`, {
      method: 'PATCH',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        start: { dateTime: newStart.toISOString() },
        end: { dateTime: newEnd.toISOString() }
      })
    });
    return res.ok;
  }catch(e){
    return false;
  }
}

async function findExistingGoogleContact(token, email){
  if(!email) return null;
  try{
    const url = `https://people.googleapis.com/v1/people:searchContacts?query=${encodeURIComponent(email)}&readMask=names,emailAddresses,phoneNumbers`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if(!res.ok) return null;
    const data = await res.json();
    const results = data.results || [];
    const match = results.find(r => (r.person.emailAddresses||[]).some(e => e.value && e.value.toLowerCase() === email.toLowerCase()));
    return match ? match.person.resourceName : null;
  }catch(e){
    return null;
  }
}

  const email = client.profile && client.profile.email ? client.profile.email.trim() : '';
  const phone = client.profile && client.profile.phone ? client.profile.phone.trim() : '';
  if(!email && !phone) return; // nothing to sync yet

  const token = await ensureGoogleAccessToken();
  if(!token) return;

  const body = { names: [{ givenName: client.name }] };
  if(email) body.emailAddresses = [{ value: email }];
  if(phone) body.phoneNumbers = [{ value: phone }];

  try{
    if(client.googleContactResourceName){
      // Already linked — fetch current etag, then update.
      const getRes = await fetch(`https://people.googleapis.com/v1/${client.googleContactResourceName}?personFields=names,emailAddresses,phoneNumbers`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if(!getRes.ok){
        console.error('Google Kişi bulunamadı, güncellenemedi', await getRes.text());
        return;
      }
      const existing = await getRes.json();
      body.etag = existing.etag;
      const updateRes = await fetch(`https://people.googleapis.com/v1/${client.googleContactResourceName}:updateContact?updatePersonFields=names,emailAddresses,phoneNumbers`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if(!updateRes.ok){
        console.error('Google Kişi güncellenemedi', await updateRes.text());
      }
    }else{
      const foundResourceName = await findExistingGoogleContact(token, email);
      if(foundResourceName){
        client.googleContactResourceName = foundResourceName;
        saveState();
        return;
      }
      const res = await fetch('https://people.googleapis.com/v1/people:createContact', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if(res.ok){
        const data = await res.json();
        client.googleContactResourceName = data.resourceName;
        saveState();
      }else{
        console.error('Google Kişiler\'e eklenemedi', await res.text());
      }
    }
  }catch(e){
    console.error('Google Kişiler senkron hatası', e);
  }
}

let contactsSyncRunning = false;

async function syncAllClientsToGoogleContacts(onProgress){
  const candidateIds = state.clients.filter(c => c.profile && (c.profile.email || c.profile.phone)).map(c=>c.id);
  let done = 0;
  for(const clientId of candidateIds){
    const liveClient = state.clients.find(c=>c.id===clientId);
    if(liveClient) await syncClientToGoogleContacts(liveClient);
    done++;
    if(onProgress) onProgress(done, candidateIds.length);
    await new Promise(r => setTimeout(r, 250)); // small pause to avoid rate limits
  }
  return { total: candidateIds.length };
}

function encodeMimeSubject(str){
  if(/^[\x00-\x7F]*$/.test(str)) return str;
  const bytes = new TextEncoder().encode(str);
  let binary=''; for(const b of bytes) binary += String.fromCharCode(b);
  return `=?UTF-8?B?${btoa(binary)}?=`;
}

function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary=''; for(const b of bytes) binary += String.fromCharCode(b);
  return btoa(binary);
}

function base64UrlEncode(str){
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function arrayBufferToBinaryString(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return binary;
}

async function createGmailDraftWithAttachment(client, session, doc, filename){
  const token = await ensureGoogleAccessToken();
  if(!token) return false;

  const to = (client.profile && client.profile.email) ? client.profile.email.trim() : '';
  const subject = `Your Receipt from ${getProvider().name} - ${formatInvoiceDate(session.date)}`;
  const bodyText = `Hello ${client.name},\n\nPlease find your receipt for the session on ${formatInvoiceDate(session.date)} attached.\n\nBest regards,`;

  const pdfBase64 = btoa(arrayBufferToBinaryString(doc.output('arraybuffer')));
  const boundary = 'boundary_' + Date.now();

  const mime =
    (to ? `To: ${to}\r\n` : '') +
    `Subject: ${encodeMimeSubject(subject)}\r\n` +
    `MIME-Version: 1.0\r\n` +
    `Content-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: text/plain; charset="UTF-8"\r\n` +
    `Content-Transfer-Encoding: base64\r\n\r\n` +
    `${utf8ToBase64(bodyText)}\r\n\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: application/pdf; name="${filename}"\r\n` +
    `Content-Disposition: attachment; filename="${filename}"\r\n` +
    `Content-Transfer-Encoding: base64\r\n\r\n` +
    `${pdfBase64}\r\n\r\n` +
    `--${boundary}--`;

  try{
    const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/drafts', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: { raw: base64UrlEncode(mime) } })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      alert('Taslak oluşturulamadı: ' + (err.error && err.error.message ? err.error.message : res.status));
      return false;
    }
    alert('Taslak Gmail\'de oluşturuldu — Gmail\'i açıp gözden geçirip gönderebilirsin.');
    return true;
  }catch(e){
    alert('Taslak oluşturulamadı: ' + e.message);
    return false;
  }
}

async function generateInvoiceForSession(client, session, action){
  const ifhp = !!(client.profile && client.profile.ifhp);
  let rate;
  if(ifhp){
    rate = 205;
  }else{
    rate = client.profile ? Number(client.profile.rate) : NaN;
    if(!rate || rate <= 0){
      alert('Önce bu danışanın profiline seans ücretini girmelisin.');
      return;
    }
  }
  let invoiceNumber = '';
  if(ifhp){
    const entered = prompt('IFHP fatura numarasını gir:');
    if(!entered || !entered.trim()){
      alert('Fatura numarası girilmeden IFHP faturası oluşturulamaz.');
      return;
    }
    invoiceNumber = entered.trim();
  }

  const doc = buildInvoiceDoc(client, session, ifhp, rate, invoiceNumber);
  const filename = invoiceFilename(client, session);

  if(ifhp){
    session.lastInvoiceNumber = invoiceNumber;
    saveState();
  }

  logAudit('fatura/makbuz oluşturuldu', `${client.name} - ${action} - CA$${rate.toFixed(2)}${ifhp ? ' - #'+invoiceNumber : ''}`);

  if(action === 'save'){
    await savePdfWithPicker(doc, filename);
  }else if(action === 'share'){
    shareInvoiceFile(doc, filename, client);
  }else if(action === 'email'){
    const { email, subject, body } = receiptEmailContent(client, session);
    window.location.href = email ? `mailto:${email}?subject=${subject}&body=${body}` : `mailto:?subject=${subject}&body=${body}`;
  }else if(action === 'gmail'){
    createGmailDraftWithAttachment(client, session, doc, filename);
  }
}

  const subject = encodeURIComponent(`Your Receipt from ${getProvider().name} - ${formatInvoiceDate(session.date)}`);

function wireTaskExtras(row, item, onSave, onRerender){
  const toggle = row.querySelector('.task-extras-toggle');
  if(toggle){
    toggle.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      if(expandedTaskExtras.has(item.id)) expandedTaskExtras.delete(item.id);
      else expandedTaskExtras.add(item.id);
      onRerender();
    });
  }
  const noteInput = row.querySelector('.task-note-input');
  if(noteInput){
    noteInput.addEventListener('blur', (ev)=>{
      item.note = ev.target.value;
      onSave();
    });
  }
  row.querySelectorAll('.task-subtask-check').forEach(cb=>{
    cb.addEventListener('change', (ev)=>{
      const id = ev.target.closest('[data-subtask-id]').getAttribute('data-subtask-id');
      const st = (item.subtasks||[]).find(s=>s.id===id);
      if(st){ st.done = ev.target.checked; onSave(); onRerender(); }
    });
  });
  row.querySelectorAll('.task-subtask-del').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      const id = ev.target.closest('[data-subtask-id]').getAttribute('data-subtask-id');
      item.subtasks = (item.subtasks||[]).filter(s=>s.id!==id);
      onSave(); onRerender();
    });
  });
  const addInput = row.querySelector('.task-subtask-add-input');
  if(addInput){
    addInput.addEventListener('keydown', (ev)=>{
      if(ev.key === 'Enter'){
        ev.preventDefault();
        const text = addInput.value.trim();
        if(text){
          if(!item.subtasks) item.subtasks = [];
          item.subtasks.push({ id: uid(), text, done:false });
          onSave(); onRerender();
        }
      }
    });
  }
}

function sortedTodos(todos, mode){
  const pending = todos.filter(t=>!t.done);
  const done = todos.filter(t=>t.done);
  if(mode === 'importance'){
    pending.sort((a,b)=> b.importance - a.importance || (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99'));
  }else{
    pending.sort((a,b)=> (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99') || (b.importance-a.importance));
  }
  done.sort((a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''));
  return { pending, done };
}

      box.innerHTML = cached.html;
      if(cached.muted) box.classList.add('muted-note');
    }
    return;
  }
  const email = client.profile.email.trim().toLowerCase();
  const events = await fetchUpcomingRangeEvents(180);
  const stillThere = document.getElementById('nextApptInfo');
  if(!stillThere) return; // user navigated away while loading
  calendarCheckedClientIds.add(client.id);

  if(events === null){
    const html = '📅 Takvim kontrol edilemedi (Google bağlantısı gerekebilir).';
    stillThere.textContent = html;
    stillThere.classList.add('muted-note');
    lastApptDisplay[client.id] = { html, muted: true };
    return;
  }

  const today = todayIso();
  const matches = events.filter(ev=>{
    const attendees = ev.attendees || [];
    const isMatch = attendees.some(a => (a.email||'').trim().toLowerCase() === email);
    if(!isMatch) return false;
    const start = ev.start && (ev.start.dateTime || ev.start.date);
    if(!start) return false;
    return start.slice(0,10) >= today;
  });

  // Sync: create a session record for any calendar appointment that doesn't have one yet,
  // and keep the date of already-linked sessions up to date if it changed on Calendar.
  let changed = false;
  matches.forEach(ev=>{
    const start = ev.start.dateTime || ev.start.date;
    const dateOnly = start.slice(0,10);
    const endTime = ev.end && ev.end.dateTime ? ev.end.dateTime : null;
    const calId = ev._calendarId || 'primary';
    let session = client.sessions.find(s => s.calendarEventId === ev.id);
    if(session){
      if(session.date !== dateOnly){
        session.date = dateOnly;
        changed = true;
      }
      if(session.calendarEndTime !== endTime){
        session.calendarEndTime = endTime;
        changed = true;
      }
      if(session.calendarId !== calId){
        session.calendarId = calId;
        changed = true;
      }
    }else{
      client.sessions.push({
        id: uid(),
        date: dateOnly,
        paymentDone:false, invoiceDone:false, notesDone:false,
        nextNote:'', nextDone:false,
        adminNote:'',
        calendarEventId: ev.id,
        calendarEndTime: endTime,
        calendarId: calId
      });
      changed = true;
    }
  });

  // Detect sessions linked to a calendar event that no longer exists (cancelled directly
  // in Google Calendar, outside the app) and remove them too — today-forward only.
  const matchedEventIds = new Set(matches.map(ev => ev.id));
  const cancelledElsewhere = client.sessions.filter(s =>
    s.calendarEventId && s.date >= today && !matchedEventIds.has(s.calendarEventId)
  );
  if(cancelledElsewhere.length){
    client.sessions = client.sessions.filter(s => !cancelledElsewhere.includes(s));
    changed = true;
  }

  if(changed){
    client.sessions.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    saveState();
  }

  const displayCandidates = matches.filter(ev=>{
    const end = ev.end && (ev.end.dateTime || ev.end.date);
    if(!end) return true;
    return new Date(end).getTime() > Date.now();
  });

  if(!displayCandidates.length){
    const html = '📅 Google Takviminde planlı bir randevu bulunamadı.';
    stillThere.textContent = html;
    stillThere.classList.add('muted-note');
    lastApptDisplay[client.id] = { html, muted: true };
  }else{
    displayCandidates.sort((a,b)=>{
      const sa = a.start.dateTime || a.start.date;
      const sb = b.start.dateTime || b.start.date;
      return sa.localeCompare(sb);
    });
    const soonest = displayCandidates[0];
    const start = soonest.start.dateTime || soonest.start.date;
    const dateOnly = start.slice(0,10);
    const label = soonest.start.dateTime
      ? `${turkishDayName(dateOnly)}, ${formatShortDate(dateOnly)} ${formatEventTime(start)}`
      : `${turkishDayName(dateOnly)}, ${formatShortDate(dateOnly)}`;
    const fullLabel = `${label}${soonest.summary ? ` — ${soonest.summary}` : ''}`;
    const html = `📅 Sonraki randevu (Takvimden otomatik): <strong>${escapeHtml(fullLabel)}</strong>`;
    stillThere.innerHTML = html;
    lastApptDisplay[client.id] = { html, muted: false };
  }

  if(changed){
    render();
  }
}

function syncSessionDateForCalendarEvent(client, eventId, newDate){
  const session = client.sessions.find(s => s.calendarEventId === eventId);
  if(session && session.date !== newDate){
    session.date = newDate;
    saveState();
    return true;
  }
  return false;
}

function removeSessionForCalendarEvent(client, eventId){
  const before = client.sessions.length;
  client.sessions = client.sessions.filter(s => s.calendarEventId !== eventId);
  if(client.sessions.length !== before){
    saveState();
    return true;
  }
  return false;
}

async function loadCalendarDayEvents(panel, client){
  const dtBtn = panel.querySelector('.cal-datetime-btn');
  const dateStr = dtBtn ? dtBtn.getAttribute('data-date') : '';
  const box = panel.querySelector('.cal-day-events');
  if(!dateStr){ box.textContent = 'Tarih seçince görünecek…'; return; }
  box.textContent = 'Yükleniyor…';
  const events = await fetchDayEvents(dateStr);
  if(events === null){
    box.textContent = 'Randevular yüklenemedi (Google bağlantısı gerekebilir).';
    return;
  }
  if(!events.length){
    box.innerHTML = `<div class="cal-day-empty">Bu günde mevcut randevu yok — boş.</div>`;
    return;
  }
  box.innerHTML = events.map(ev=>{
    const timeLabel = ev.start && ev.start.dateTime ? formatEventTime(ev.start.dateTime) : 'Tüm gün';
    return `<div class="cal-day-event-row" data-event-id="${ev.id}" data-calendar-id="${escapeAttr(ev._calendarId||'primary')}">
      <span class="cal-day-event-time">${timeLabel}</span>
      <span class="cal-day-event-title">${escapeHtml(ev.summary||'(başlıksız)')}</span>
      <button class="cal-event-edit-btn" type="button" title="Yeniden planla">✏️</button>
      <button class="cal-event-cancel-btn" type="button" title="İptal et">✕</button>
    </div>`;
  }).join('');

  box.querySelectorAll('.cal-event-cancel-btn').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      const row = ev.target.closest('.cal-day-event-row');
      const eventId = row.getAttribute('data-event-id');
      const calendarId = row.getAttribute('data-calendar-id') || 'primary';
      if(!confirm('Bu randevu iptal edilsin mi? Danışana bilgilendirme gider.')) return;
      btn.disabled = true;
      const ok = await cancelCalendarEvent(eventId, calendarId);
      if(ok){
        const sessionRemoved = removeSessionForCalendarEvent(client, eventId);
        if(sessionRemoved){ render(); }
        else{ loadCalendarDayEvents(panel, client); }
      }else{
        alert('Randevu iptal edilemedi.'); btn.disabled = false;
      }
    });
  });
  box.querySelectorAll('.cal-event-edit-btn').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      const row = ev.target.closest('.cal-day-event-row');
      const eventId = row.getAttribute('data-event-id');
      const calendarId = row.getAttribute('data-calendar-id') || 'primary';
      const timeEl = row.querySelector('.cal-day-event-time');
      const currentTimeLabel = (timeEl && timeEl.textContent !== 'Tüm gün') ? timeEl.textContent : '10:00 AM';

      openReschedulePopover({
        initialDate: dateStr,
        initialTimeLabel: currentTimeLabel,
        onConfirm: async (newDate, newTimeLabel)=>{
          const newTime = parseAmPmTime(newTimeLabel);
          if(!newTime) return;
          btn.disabled = true;
          const ok = await rescheduleCalendarEvent(eventId, newDate, newTime, calendarId);
          if(ok){
            const sessionUpdated = syncSessionDateForCalendarEvent(client, eventId, newDate);
            if(sessionUpdated){ render(); }
            else{ loadCalendarDayEvents(panel, client); }
          }else{
            alert('Randevu güncellenemedi.'); btn.disabled = false;
          }
        }
      });
    });
  });
}

function wireCalendarPanel(client){
  const panel = document.getElementById('calendarPanel');

  const dtBtn = panel.querySelector('.cal-datetime-btn');
  dtBtn.addEventListener('click', ()=>{
    openReschedulePopover({
      title: 'Randevu Tarih ve Saati Seç',
      initialDate: dtBtn.getAttribute('data-date'),
      initialTimeLabel: dtBtn.getAttribute('data-time') || '10:00 AM',
      onConfirm: (newDate, newTimeLabel)=>{
        dtBtn.setAttribute('data-date', newDate);
        dtBtn.setAttribute('data-time', newTimeLabel);
        dtBtn.textContent = calDateTimeButtonLabel(newDate, newTimeLabel);
        loadCalendarDayEvents(panel, client);
      }
    });
  });
  if(panel.classList.contains('open')) loadCalendarDayEvents(panel, client);

  panel.querySelector('.cal-repeat').addEventListener('change', (ev)=>{
    panel.querySelector('.cal-repeat-options').style.display = ev.target.checked ? 'block' : 'none';
  });

  panel.querySelector('.cal-create-btn').addEventListener('click', async ()=>{
    const title = panel.querySelector('.cal-title').value.trim();
    const dateStr = dtBtn.getAttribute('data-date');
    const timeRaw = dtBtn.getAttribute('data-time');
    const timeStr = parseAmPmTime(timeRaw);
    const durationMinutes = Number(panel.querySelector('.cal-duration').value);
    const inviteClient = panel.querySelector('.cal-invite').checked;
    const repeatWeekly = panel.querySelector('.cal-repeat').checked;
    const repeatWeeks = Math.max(2, Math.min(52, Number(panel.querySelector('.cal-repeat-weeks').value) || 8));
    if(!title || !dateStr || !timeRaw){
      alert('Başlık, tarih ve saat gerekli.');
      return;
    }
    if(!timeStr){
      alert('Saat formatı geçersiz. Örnek: 2:30 PM ya da 10:00 AM şeklinde gir.');
      return;
    }
    const btn = panel.querySelector('.cal-create-btn');
    btn.disabled = true;

    if(repeatWeekly){
      const baseDate = new Date(dateStr + 'T00:00:00');
      let successCount = 0;
      for(let i = 0; i < repeatWeeks; i++){
        btn.textContent = `Oluşturuluyor… (${i+1}/${repeatWeeks})`;
        const d = new Date(baseDate.getTime() + i*7*24*60*60*1000);
        const dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const ok = await createCalendarEvent(client, { title, dateStr: dStr, timeStr, durationMinutes, inviteClient });
        if(ok) successCount++;
        await new Promise(r => setTimeout(r, 300));
      }
      btn.disabled = false; btn.textContent = 'Randevu Oluştur';
      alert(`${successCount} / ${repeatWeeks} randevu Google Takvimine eklendi.`);
      calendarCheckedClientIds.delete(client.id);
      panel.classList.remove('open');
      loadNextAppointmentInfo(client);
      return;
    }

    btn.textContent = 'Oluşturuluyor…';
    const ok = await createCalendarEvent(client, { title, dateStr, timeStr, durationMinutes, inviteClient });
    btn.disabled = false; btn.textContent = 'Randevu Oluştur';
    if(ok){
      alert('Randevu Google Takvimine eklendi.');
      calendarCheckedClientIds.delete(client.id);
      panel.classList.remove('open');
      loadNextAppointmentInfo(client);
    }else{
      loadCalendarDayEvents(panel, client);
    }
  });
}

function wireTodoPanel(client){
  const panel = document.getElementById('todoPanel');
  const wasOpen = panel.classList.contains('open');

  const refresh = ()=>{
    renderMain();
    if(wasOpen) document.getElementById('todoPanel').classList.add('open');
  };

  panel.querySelector('.todo-add-btn').addEventListener('click', ()=>{
    const textInput = panel.querySelector('.todo-text');
    const text = textInput.value.trim();
    if(!text) return;
    const importance = Number(panel.querySelector('.todo-importance').value);
    const dueDate = panel.querySelector('.todo-duedate').value;
    client.todos = client.todos || [];
    client.todos.push({ id: uid(), text, importance, dueDate, done:false, doneAt:null });
    saveState();
    panel.classList.add('open');
    renderMain();
    document.getElementById('todoPanel').classList.add('open');
  });

  panel.querySelector('.todo-sort-select').addEventListener('change', (ev)=>{
    todoSortByClient[client.id] = ev.target.value;
    panel.classList.add('open');
    renderMain();
    document.getElementById('todoPanel').classList.add('open');
  });

  panel.querySelectorAll('.todo-item').forEach(row=>{
    const id = row.getAttribute('data-id');
    row.querySelector('.todo-check').addEventListener('change', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      todo.done = ev.target.checked;
      todo.doneAt = todo.done ? todayIso() : null;
      saveState();
      panel.classList.add('open');
      renderMain();
      document.getElementById('todoPanel').classList.add('open');
    });
    row.querySelector('.todo-item-text-input').addEventListener('blur', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      const val = ev.target.value.trim();
      if(val){ todo.text = val; saveState(); }
      else{ ev.target.value = todo.text; }
    });
    row.querySelector('.todo-item-importance-select').addEventListener('change', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      todo.importance = Number(ev.target.value);
      saveState();
      panel.classList.add('open');
      renderMain();
      document.getElementById('todoPanel').classList.add('open');
    });
    row.querySelector('.todo-item-duedate-input').addEventListener('change', (ev)=>{
      const todo = client.todos.find(t=>t.id===id);
      todo.dueDate = ev.target.value;
      saveState();
      panel.classList.add('open');
      renderMain();
      document.getElementById('todoPanel').classList.add('open');
    });
    row.querySelector('.todo-del').addEventListener('click', ()=>{
      if(confirm('Bu iş silinsin mi?')){
        client.todos = client.todos.filter(t=>t.id!==id);
        saveState();
        panel.classList.add('open');
        renderMain();
        document.getElementById('todoPanel').classList.add('open');
      }
    });
    const todoItem = client.todos.find(t=>t.id===id);
    wireTaskExtras(row, todoItem, saveState, refresh);
  });
}

function noShowSummaryText(client){
  const sessions = (client.sessions||[]).filter(s=>isSessionDue(s));
  const total = sessions.length;
  const noShowCount = sessions.filter(s=>s.noShow).length;
  if(total === 0) return 'Henüz seans yok.';
  if(noShowCount === 0) return `0 gelmedi (${total} seans)`;
  const pct = Math.round((noShowCount/total)*100);
  return `${noShowCount} gelmedi / ${total} seans (%${pct})`;
}
